# Tour-Termine (werden auf der Tour-Seite in beiden Sprachen angezeigt)
# Plätze – zwei Möglichkeiten:
#   free: 8        → zeigt „Quedan 8 plazas“ (bis 3 orange, 0 = ausgebucht). Einfach herunterzählen.
#   status: ...    → wenn "free" fehlt: request = Plätze auf Anfrage · open = Plätze frei ·
#                    few = letzte Plätze · full = ausgebucht
# Am einfachsten im Formular von Pages CMS (Anleitung im README, „Guía rápida“).
# Genaues Datum: start + end eintragen (z. B. 2027-04-12 / 2027-04-21).
# Noch ungefähres Datum: zusätzlich "label" (Zeitraum, z. B. „Abril 2027“) und optional "note"
# (kleiner Hinweis darunter, z. B. „Fecha exacta por confirmar“) – dann wird der Text statt des Datums gezeigt.
# "start" dient dann nur zum Sortieren und Ausblenden vergangener Termine.
# trip: welche Reise (espiritual = Viaje espiritual, 11 Tage · arutam = Viaje Arutam, 22 Tage).
#       Name, Dauer und Preis kommen aus trips in _data/{es,en,fr}/tours.yml.

dates:
  - start: 2027-04-15
    end: 2027-05-31
    trip: espiritual
    label: { es: "Abril / mayo 2027", en: "April / May 2027", fr: "Avril / mai 2027" }
    note: { es: "Fecha exacta por confirmar", en: "Exact date to be confirmed", fr: "Date exacte à confirmer" }
    status: request
  - start: 2027-08-01
    end: 2027-09-30
    trip: arutam
    label: { es: "Agosto / septiembre 2027", en: "August / September 2027", fr: "Août / septembre 2027" }
    note: { es: "Fecha exacta por confirmar", en: "Exact date to be confirmed", fr: "Date exacte à confirmer" }
    status: request
