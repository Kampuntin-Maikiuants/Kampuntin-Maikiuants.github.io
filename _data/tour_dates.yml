# Tour-Termine (werden auf der Tour-Seite in beiden Sprachen angezeigt)
# Plätze – zwei Möglichkeiten:
#   free: 8        → zeigt „Quedan 8 plazas“ (bis 3 orange, 0 = ausgebucht). Einfach herunterzählen.
#   status: ...    → wenn "free" fehlt: request = Plätze auf Anfrage · open = Plätze frei ·
#                    few = letzte Plätze · full = ausgebucht
# Am einfachsten im Formular von Pages CMS (Anleitung im README, „Guía rápida“).
# Genaues Datum: start + end eintragen (z. B. 2027-04-12 / 2027-04-21).
# Noch ungefähres Datum: zusätzlich "label" setzen – dann wird der Text statt des Datums gezeigt.
# "start" dient dann nur zum Sortieren und Ausblenden vergangener Termine.

dates:
  - start: 2027-04-15
    end: 2027-04-30
    label: { es: "Abril 2027 · mediados o finales de mes", en: "April 2027 · mid or late April" }
    status: request
  - start: 2027-08-01
    end: 2027-09-30
    label: { es: "Agosto o septiembre 2027", en: "August or September 2027" }
    status: request
