hero:
  eyebrow: Tours · 10 jours · 12 personnes max.
  title: Passez vos journées dans la forêt, au sein de notre communauté
  lead: >-
    Vous partagez le quotidien de la communauté de Maikiuants, marchez en forêt avec des guides
    shuar, travaillez dans les potagers, cuisinez, faites de la musique, écoutez des histoires et
    découvrez un autre rythme de vie.
  image: "/assets/img/fotos/hero-tours.jpg"
  image_alt: Des visiteurs marchent dans la forêt avec un guide

