intro:
  title: À propos du tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Des membres de la communauté partagent une boisson et de l’artisanat avec des visiteurs
  text: |-
    Kampuntin et Raíces travaillent ensemble : la réservation se fait via **Raíces**, notre
    organisation sœur en Belgique, et à Maikiuants **Kampuntin** organise tout le voyage.

    La communauté vous accueille pour un **échange culturel et spirituel**. Avec des membres de la
    communauté, vous partagez l’hébergement dans une jea traditionnelle, cuisinez et mangez
    ensemble, et découvrez la forêt et l’usage des plantes médicinales. Nous avons la meilleure douche du monde : la rivière.

    Vous apprendrez à cuisiner vos nouveaux plats préférés — et à en récolter les ingrédients.
    Nous faisons de la musique ensemble et vous montrons comment jouer de nos flûtes
    fabriquées à la main. Les journées mêlent balades en forêt, travail à la pépinière et dans
    les potagers, artisanat, cuisine et temps libre.

    Pour les Shuar, **Arutam** est la force présente dans les cascades, qui relie tous les êtres vivants – un lieu d’introspection et de connexion au vivant. Les deux voyages mènent à la cascade sacrée.


life:
  title: La vie dans la jea
  text: Voici comment vous vivrez pendant votre séjour à Maikiuants.



experience:
  title: "Le voyage Arutam : 22 jours"
  intro: La grande aventure à travers le territoire shuar, de Cuenca à la Cueva de los Tayos et au Río Santiago.
  arrival_title: "Arrivée à Cuenca"
  arrival: >-
    Le voyage commence à Cuenca, à 2 800 mètres d’altitude. Après une journée libre pour vous acclimater, nous découvrons le centre historique, le marché local et le musée Pumapungo. Nous allons en bus jusqu’à Limón Indanza, où un chaman shuar guide une cérémonie de purification, puis nous continuons en 4×4 à travers la Cordillère du Condor jusqu’à Maikiuants, où la communauté nous accueille avec de la danse et une fête.
  activities_title: "Une dizaine de jours à Maikiuants"
  activities_note: >-
    Les activités dépendent de la saison et du programme de la communauté. Nous sommes heureux d’écouter vos souhaits et vos intérêts et de les intégrer.
  activities:
    - "Accueil de la communauté avec danse et fête"
    - "Randonnées dans la forêt vers des cascades et des grottes"
    - "Récits des anciens sur le peuple shuar"
    - "Découvrir comment la communauté défend son territoire face à l’industrie minière"
    - "Installer un piège photographique pour observer la faune"
    - "Journée de Nunkui : semer, planter et récolter dans les parcelles familiales avec des chants anent"
    - "Cuisiner la récolte et préparer la chicha de manioc"
    - "Poterie avec les femmes de la communauté : récolter l’argile, modeler, peindre et cuire"
    - "Journée de Tsunki : reconnaître et récolter des plantes médicinales"
    - "Un bain de vapeur shuar aux plantes médicinales"
    - "Marche vers la cascade sacrée et cérémonie autour de la cosmovision shuar"
    - "Tresser la changuina, le panier traditionnel"
    - "Goûter des mets de la forêt"
    - "Le fleuve Coangos et les récits des haches préhispaniques"
    - "Construire un abri (ayamte) et passer la nuit dans la forêt"
  departure_title: "Adieux, expédition et retour"
  departure: >-
    À la fin du séjour à Maikiuants, nous faisons nos adieux lors d’une grande fête avec toute la communauté : un grand dîner, de la musique et de la danse. Il y a aussi un échange de cadeaux : la communauté offre des cadeaux aux visiteurs et, s’ils le souhaitent, les visiteurs peuvent aussi en offrir aux habitants. Vient ensuite l’expédition à la Cueva de los Tayos : en pirogue jusqu’à la communauté de Coangos, une descente de 60 mètres en rappel et une nuit dans la grotte. Ensuite, nous naviguons en pirogue traditionnelle sur le Río Santiago jusqu’à des communautés shuar du côté péruvien, avec une lagune riche en faune et une dernière nuit en forêt. À Limón Indanza, nous faisons ensemble le bilan du voyage, puis nous rentrons à Cuenca pour un dîner d’adieu. Le 22e jour, vous prenez votre vol retour.

# Voyage spirituel (11 jours) – même structure que experience
spiritual:
  title: "Le voyage spirituel : 11 jours"
  intro: Un voyage plus court, centré sur la spiritualité shuar et la connexion à la nature.
  arrival_title: Arrivée à Cuenca
  arrival: >-
    Nous nous retrouvons à Cuenca et faisons connaissance. Le lendemain, nous visitons le musée
    Pumapungo et participons à un nettoyage spirituel, puis nous entrons sur le territoire shuar.
  activities_title: Cérémonies à Maikiuants
  activities:
    - "Récolter la chonta dans les huertas avec la communauté"
    - "La cérémonie de la chonta : le Nouvel An shuar, avec de la chicha de chonta"
    - "Plantes médicinales et bain de vapeur shuar"
    - "Une cérémonie ancestrale guidée par les Shuar, avec un temps de jeûne"
    - "La marche vers la cascade sacrée d’Arutam, avec des chants sacrés (anent)"
    - "Une nuit dans la forêt, dans un abri construit avec des matériaux de la forêt"
  activities_note: >-
    Avant le voyage, nous vous expliquons en détail le déroulement des cérémonies et comment vous y
    préparer.
  departure_title: Clôture et retour
  departure: >-
    À la fin, nous partageons et interprétons ensemble ce que nous avons vécu. Le 11e jour, nous
    rentrons à Cuenca.

