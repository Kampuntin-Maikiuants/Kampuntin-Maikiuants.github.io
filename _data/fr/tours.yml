price:
  title: Prix
  amount: "3 890 €"
  per: par personne, 22 jours
  text: >-
    Tout compris pendant 22 jours depuis Cuenca : hébergement, repas, tous les transports pendant
    le voyage, guides, interprètes, assurance voyage, sécurité et activités. Nous organisons les tours avec l’organisation belge
    Raíces. Nous rémunérons des guides et des cuisinières de la communauté, achetons la
    nourriture sur place et soutenons financièrement Maikiuants. Le paiement et tous
    les autres détails sont convenus personnellement avec vous. Si ce voyage vous inspire mais que les fonds vous manquent, écrivez-nous : nous vous conseillons pour organiser des événements afin de les réunir.

