price:
  title: Prix
  per: par personne
  text: >-
    Tout compris depuis Cuenca : hébergement, repas, tous les transports pendant le voyage, guides,
    interprètes, assurance voyage, sécurité et activités. La réservation se fait via Raíces, et à
    Maikiuants Kampuntin organise le voyage. Nous rémunérons des guides et des cuisinières de la communauté, achetons la
    nourriture sur place et soutenons financièrement Maikiuants. Le paiement et tous
    les autres détails sont convenus personnellement avec vous. Si ce voyage vous inspire mais que les fonds vous manquent, écrivez-nous : nous vous conseillons pour organiser des événements afin de les réunir.

