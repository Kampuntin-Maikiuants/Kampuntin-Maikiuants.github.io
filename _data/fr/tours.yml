  per: par personne
  # Ohne „amount“ bei den Reisen steht „on_request“ statt eines Preises
  on_request: "Prix sur demande"
  button: "Demander le prix"
  text: >-
    Écrivez-nous et nous vous envoyons le prix de votre voyage avec tous les détails. Il comprend l’hébergement, les repas, le transport depuis Limón Indanza, les guides et les activités. Nous rémunérons des guides et des cuisinières de la communauté, achetons la nourriture sur place et soutenons financièrement Maikiuants. Si ce voyage vous inspire mais que les fonds vous manquent, écrivez-nous : nous vous conseillons pour organiser des événements afin de les réunir.

