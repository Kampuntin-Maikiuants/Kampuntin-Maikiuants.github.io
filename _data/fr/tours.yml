faq:
  title: Questions fréquentes
  items:
    - q: Faut-il être en très bonne condition physique ?
      a: >-
        Une bonne condition physique de base suffit. Nous marchons sur des sentiers boueux, avec
        des montées et des traversées de rivière, parfois pendant plusieurs heures. Pour accéder à
        la Cueva de los Tayos, il faut descendre 60 mètres en rappel, accompagnés de guides locaux.
        C’est une vraie aventure : il est important d’aimer marcher et d’avoir envie de sortir de
        sa zone de confort. Si vous avez des limitations, dites-le-nous et nous trouverons des alternatives.
    - q: Y a-t-il de l’électricité, du réseau téléphonique et Internet ?
      a: >-
        La cuisine fonctionne à l’énergie solaire et vous pouvez y recharger votre téléphone. Il n’y
        a ni Wi-Fi ni réseau téléphonique dans la jea, mais il y a du Wi-Fi gratuit au village, à
        environ 35 minutes à pied.
    - q: Quelles langues parle-t-on ?
      a: >-
        À Maikiuants, on parle le Shuar Chicham et l’espagnol – presque aucune autre langue.
        Pendant le tour, Julien, notre guide francophone et traducteur, ainsi que des interprètes de la communauté vous accompagnent, et nous
        trouvons toujours un moyen de nous comprendre.
    - q: Est-ce sûr ?
      a: >-
        La communauté de Maikiuants repose sur la confiance, et se déplacer à l’intérieur de la communauté est sûr. Lors des excursions et dans la forêt, vous êtes toujours accompagné de membres de la communauté qui connaissent bien la région.

