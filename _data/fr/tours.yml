# Les deux voyages. Les dates sont dans _data/tour_dates.yml (champ trip : espiritual ou arutam).
trips_title: Deux voyages
trips_intro: "Les deux voyages commencent et se terminent à Limón Indanza ; le mieux est d’y arriver depuis Cuenca. Choisissez celui qui vous convient."
trips:
  espiritual:
    name: Voyage spirituel
    days: 8 jours
    when: Avril – mai 2027
    text: >-
      Une immersion dans la spiritualité shuar : la cérémonie de la chonta (le Nouvel An shuar),
      les plantes médicinales, des rituels traditionnels et la marche vers la cascade sacrée
      d’Arutam.
    link: Voir le programme
  arutam:
    name: Voyage Arutam
    days: 10 jours
    when: Août – septembre 2027
    text: >-
      Dix jours avec la communauté à Maikiuants : balades en forêt vers des cascades et des grottes, culture shuar, poterie, plantes médicinales, la cascade sacrée et une nuit en forêt.
    link: Voir le programme


# Remarque sous les deux voyages : voyages scolaires sur demande
school_trips:
  title: "Voyages scolaires :"
  text: "Nous organisons aussi des voyages de 10 jours pour des groupes scolaires, sur demande."

intro:
  title: À propos du tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Des membres de la communauté partagent une boisson et de l’artisanat avec des visiteurs
  text: |-
    Les tours sont organisés par **Kampuntin**, l’organisation de tourisme communautaire de Maikiuants : par nous-mêmes, avec toute la communauté.

    La communauté vous accueille pour un **échange culturel et spirituel**. Avec des membres de la
    communauté, vous partagez l’hébergement dans une jea traditionnelle, cuisinez et mangez
    ensemble, et découvrez la forêt et l’usage des plantes médicinales. Nous avons la meilleure douche du monde : la rivière.

    Vous apprendrez à cuisiner vos nouveaux plats préférés — et à en récolter les ingrédients.
    Nous faisons de la musique ensemble et vous montrons comment jouer de nos flûtes
    fabriquées à la main. Les journées mêlent balades en forêt, travail à la pépinière et dans
    les potagers, artisanat, cuisine et temps libre.

    Pour les Shuar, **Arutam** est la force présente dans les cascades, qui relie tous les êtres vivants – un lieu d’introspection et de connexion au vivant. Les deux voyages mènent à la cascade sacrée.


life:
  title: La vie dans la jea
  text: Voici comment vous vivrez pendant votre séjour à Maikiuants.



experience:
  title: "Le voyage Arutam : 10 jours"
  intro: "Dix jours sur le territoire shuar de Maikiuants : forêt, cascades, culture et vie communautaire."
