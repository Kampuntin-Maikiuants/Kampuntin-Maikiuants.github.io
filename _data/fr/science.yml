# Book: title from the cover. Please fill in the remaining details in [square brackets].
book:
  eyebrow: Notre livre
  title: Guía de macroinvertebrados acuáticos
  subtitle: "Guide des macroinvertébrés aquatiques des micro-bassins versants des rivières Aakas et Yunkumas – Cordillera del Cóndor"
  cover: "/assets/img/libro/portada-recortada.jpg"
  cover_alt: Couverture du guide des macroinvertébrés aquatiques des rivières Aakas et Yunkumas
  text: >-
    La communauté shuar de Maikiuants, établie dans la Cordillera del Cóndor, possède un vaste territoire qui abrite une grande biodiversité d’espèces et d’écosystèmes, aujourd’hui menacés par des activités extractives. Cette zone est principalement arrosée par les rivières Aakas et Yunkumas, dont les écosystèmes aquatiques abritent une grande variété de faune, parmi laquelle se distinguent les macroinvertébrés aquatiques. Ce guide présente les familles de ce groupe de faune ; leur présence montre que les eaux de ces deux rivières sont en excellent état. Cet ouvrage est le résultat d’études menées conjointement par l’Universidad del Azuay, la communauté de Maikiuants, le Pueblo Shuar Arutam et la Fundación Ecoforensic, dont l’objectif est d’explorer et de faire connaître la richesse biologique et culturelle de ce territoire.
  details:
    - { label: Langue, value: "Espagnol" }
    - { label: Éditeur, value: "Universidad del Azuay & Casa Editorial" }
    - { label: ISBN, value: "978-9942-54-103-1" }
  button: { label: Se renseigner sur le livre, url: "" }   # empty url = contact page
  pages_title: Un aperçu du livre
  pages:
    - { image: /assets/img/libro/anatomia.jpg, alt: "Page du livre : anatomie des macroinvertébrés" }
    - { image: /assets/img/libro/paginas.jpg, alt: "Double page avec une sangsue (Glossiphoniidae)" }
    - { image: /assets/img/libro/portada-mano.jpg, alt: Le guide en main }
