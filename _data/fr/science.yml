# Page science (paraécologie) – français

hero:
  eyebrow: Science
  title: "Paraécologie : la communauté étudie sa forêt"
  lead: >-
    À Maikiuants, des membres de la communauté se forment pour devenir paraécologues. Ils allient
    les savoirs shuar sur la forêt aux méthodes scientifiques pour documenter la biodiversité et
    protéger leur territoire.
  image: "/assets/img/fotos/hero-ciencia.jpg"
  image_alt: Des paraécologues de Maikiuants travaillent au microscope

what:
  title: Qu’est-ce qu’un paraécologue ?
  image: "/assets/img/fotos/paraecologos.jpg"
  image_alt: L’équipe de paraécologues au bord de la rivière
  text: |-
    Un ou une paraécologue est un membre de la communauté formé aux méthodes de suivi
    écologique. Connaissant la forêt et ses particularités depuis l’enfance, il ou elle apprend
    à consigner ses observations de façon systématique, afin qu’elles puissent être comparées au
    fil des années et partagées avec des chercheurs.

    Ainsi, le savoir reste dans la communauté, et les données aident à prendre des décisions sur
    le territoire : où construire de nouvelles maisons, quelles zones protéger, et comment la
    rivière et la forêt évoluent avec le changement climatique. Le but est de défendre le
    territoire, pas seulement la forêt.
  quote:
    text: >-
      Nous sommes des personnes qui viennent en aide à toute la biodiversité de notre territoire –
      pour la connaître, la valoriser et la respecter – et nous éveillons la conscience
      environnementale pour que les générations futures continuent d’en prendre soin. Être
      paraécologue, c’est venir en aide à chaque espèce menacée d’extinction.
    author: Freddy Ankuash, paraécologue, gérant et coordinateur de Kampuntin

methods:
  title: Ce que nous surveillons
  intro: >-
    En plus de la
    station météorologique et des pièges photographiques déjà en place, une nouvelle station
    scientifique sera bientôt construite pour recueillir et analyser les données de façon encore
    plus systématique.
  items:
    - title: Pièges photographiques
      text: >-
        Des caméras automatiques ont été installées sur le territoire d’animaux menacés pour
        observer leur comportement, leurs rythmes d’activité et, si possible, leur reproduction.
    - title: Sorties d’exploration
      text: >-
        À chaque sortie, nous observons tout à la fois : chants d’oiseaux, amphibiens, mammifères et autres
        indicateurs de la forêt, arbres semenciers, floraison et fructification – en lien avec la
        pépinière et l’agroforesterie.
    - title: Qualité de l’eau
      text: >-
        Nous analysons régulièrement les rivières et les ruisseaux : pH, température, turbidité et
        macroinvertébrés aquatiques, qui réagissent très vite à toute pollution.
    - title: Station météorologique
      text: >-
        Notre station météorologique enregistre la température, l’humidité, les précipitations et
        le vent, afin de documenter l’évolution du climat sur le territoire.
    - title: La vie shuar
      text: >-
        Nous documentons la vie et les savoirs shuar : nous prenons des photos, enregistrons la
        langue Shuar Chicham et notons les noms, les usages et les récits liés aux plantes et aux
        animaux.
    - title: Nouvelle station scientifique
      text: >-
        Bientôt : une station dédiée pour stocker, traiter et analyser les données du suivi
        directement à Maikiuants.

