animals:
  title: Nos voisins les animaux
  intro: >-
    La forêt et les rivières de Maikiuants abritent d’innombrables animaux. Certains sont
    menacés, d’autres sont nouveaux pour la science, et beaucoup vivent cachés sous l’eau.

  threatened:
    title: Espèces menacées
    intro: >-
      Maikiuants est une zone de grande importance pour la biodiversité. La relation harmonieuse
      entre la communauté shuar et la nature permet à des mammifères menacés à l’échelle mondiale
      de vivre sur son territoire. En 2024, les pièges photographiques ont notamment enregistré :
    note: Catégories de menace selon notre panneau d’information.
    also: "Également enregistrés : margay, tayra, ocelot, écureuil amazonien et faux vampire, entre autres."
    sensitive: Pour les protéger, nous ne publions jamais la localisation exacte des espèces sensibles.

  atelopus:
    title: "Une grenouille très particulière : Atelopus sp."
    name: Atelopus sp.
    images:
      - { image: /assets/img/fotos/atelopus.jpg, alt: Grenouille Atelopus jaune et noire sur de la mousse }
      - { image: /assets/img/fotos/atelopus-2.jpg, alt: Grenouille Atelopus vue de dessous, dans la main d’un guide }
    text: |-
      Toutes les espèces du genre *Atelopus* sont menacées. La grenouille *Atelopus sp.* est en
      danger, principalement à cause de la perte de son habitat naturel. Maikiuants est l’un des
      rares endroits au monde où l’on peut encore l’observer.

      Sa survie dépend d’un écosystème équilibré, avec des forêts saines et une eau propre. Elle
      est si sensible aux changements de son environnement et si difficile à trouver qu’elle est
      encore en cours de description scientifique.

  frog:
    title: Une espèce nouvelle pour la science ?
    name: Rhinella maikiuants (nom proposé)
    images:
      - { image: /assets/img/fotos/rana-nueva.jpg, alt: Le crapaud de Maikiuants qui pourrait être une nouvelle espèce }
      - { image: /assets/img/fotos/rana-nueva-2.jpg, alt: Le crapaud dans un sac d’échantillonnage pendant le suivi }
      - { image: /assets/img/fotos/rana-nueva-3.jpg, alt: Le crapaud sur une pierre, photographié pendant le suivi }
    text: |-
      Le **19 juin 2024**, lors d’une sortie de suivi, les paraécologues ont trouvé un crapaud de
      la famille des *Bufonidae* aux caractéristiques très inhabituelles. Tout porte à croire qu’il
      s’agit d’une **espèce nouvelle pour la science**, qui n’existe que sur le territoire de
      Maikiuants. C’est pourquoi nous proposons le nom scientifique ***Rhinella maikiuants***.

      Une dizaine de paraécologues de Maikiuants participent à la recherche, avec le soutien de
      l’Universidad del Azuay (UDA) et en collaboration avec Ecoforensic, une entreprise de
      Grande-Bretagne qui vérifie également les résultats. La découverte est actuellement examinée par la communauté scientifique ; nous
      espérons que l’espèce sera bientôt officiellement reconnue.

  river:
    title: "La vie sous l’eau : les animaux de nos rivières"
    image: /assets/img/libro/collage.jpg
    image_alt: Macroinvertébrés aquatiques de nos rivières (photos du livre)
    text: |-
      L’eau des rivières Yunkumas et Akaas est en excellent état parce que la forêt est intacte –
      nous mesurons un pH de 7,8. Les rivières abritent de petits animaux aquatiques (larves
      d’insectes, escargots, crabes et crevettes) que presque personne ne voit jamais. Les
      paraécologues les récoltent, les identifient et les photographient.

      Comme ils réagissent rapidement à la pollution, ils nous aident à comprendre la qualité de
      l’eau et à détecter immédiatement le moindre changement – par exemple dans les rivières
      voisines touchées par l’exploitation minière.
    book_note: >-
      Photographies : *Guía de macroinvertebrados acuáticos de las microcuencas de los ríos Aakas y
      Yunkumas – Cordillera del Cóndor*. Le guide complet décrit bien d’autres familles, leur
      anatomie et leur rôle d’indicateurs de la qualité de l’eau.
    book_link: Voir la publication
    groups:          # Fotos aus dem Buch
      - { name: "Éphémère", latin: Euthyplociidae, image: /assets/img/libro/euthyplociidae.jpg }
      - { name: "Demoiselle (larve)", latin: Polythoridae, image: /assets/img/libro/polythoridae.jpg }
      - { name: "Coléoptère pséphénidé", latin: Psephenidae, image: /assets/img/libro/psephenidae.jpg }
      - { name: "Coléoptère des rapides (larve)", latin: Elmidae, image: /assets/img/libro/elmidae.jpg }
      - { name: "Coléoptère dryopidé", latin: Dryopidae, image: /assets/img/libro/dryopidae.jpg }
      - { name: "Staphylin", latin: Staphylinidae, image: /assets/img/libro/staphylinidae.jpg }
      - { name: "Moucheron des torrents (larve)", latin: Blephariceridae, image: /assets/img/libro/blephariceridae.jpg }
      - { name: "Simulie (larve)", latin: Simuliidae, image: /assets/img/libro/simuliidae.jpg }
      - { name: "Sangsue", latin: Glossiphoniidae, image: /assets/img/libro/glossiphoniidae.jpg }
