about:
  title: "Qui nous sommes"
  items:
    - title: "Les Shuar"
      image: "/assets/img/fotos/shuar.jpg"
      image_alt: "Familles shuar de Maikiuants dans la forêt"
      text: >-
        Les Shuar sont un peuple millénaire, l’un des plus nombreux de l’Amazonie, dont l’objectif est de protéger le territoire. Leur langue est le **shuar chicham**. Leur vie est profondément liée à la forêt, aux rivières et à la spiritualité.
    - title: Maikiuants
      image: "/assets/img/fotos/maikiuants.jpg"
      image_position: bottom
      image_alt: "Le centre de la communauté de Maikiuants entouré de forêt"
      text: >-
        Maikiuants est une communauté shuar de la province de Morona Santiago, dans l’Amazonie australe de l’Équateur, et fait partie du **Pueblo Shuar Arutam**. Le village tire son nom de la rivière qui le traverse : *maikiua* est le guanto (datura), qui pousse tout le long de ses rives, et *ants* signifie eau. Maikiuants signifie « l’eau du guanto ».
    - title: Kampuntin
      image: "/assets/img/fotos/kampuntin.jpg"
      image_alt: "L’équipe de Kampuntin avec un groupe de bénévoles devant la jea"
      text: >-
        *Kampuntin* signifie « forêt » en shuar chicham, d’où notre devise **« Selva, mi destino »** (la forêt, ma destination). Nous sommes nés au sein de la communauté de Maikiuants. Nous voulons créer un échange culturel, en partageant un regard sur la forêt et la communauté de l’intérieur, tout en soutenant économiquement la communauté de Maikiuants. Kampuntin est aussi l’organisation derrière le travail scientifique, le suivi et la protection du territoire.


# PLACEHOLDER – the mission will be worded in more detail later
mission:
  title: La mission de Kampuntin
  intro: |-
    L’Organisation communautaire de services touristiques KAMPUNTIN, Selva Mi Destino, a pour objectif de préserver la culture, les coutumes et la sagesse ancestrale du peuple Shuar, en favorisant un échange culturel fondé sur le respect, l’identité et la nature.

    Nos principes reposent sur la protection de l’Amazonie, la conservation de la forêt, la transmission des savoirs aux nouvelles générations et au monde, ainsi que le renforcement d’une économie durable qui profite aux familles de la communauté de Maikiuants.

    Chez Kampuntin, il ne s’agit pas seulement de tourisme, mais de partager notre identité, de défendre notre territoire et de construire un avenir fondé sur la dignité, la culture et l’harmonie avec la nature.

    **KAMPUNTIN – SELVA MI DESTINO**<br>Développement économique avec identité, respect de la nature et fierté d’être Shuar.
  items:
    - title: Protéger et surveiller le territoire
      text: >-
        Nous prenons soin de la forêt, des rivières et des animaux de notre territoire et nous les
        surveillons, pour que les générations futures puissent, elles aussi, en vivre et vivre avec
        eux.
    - title: Partager et documenter la culture shuar
      text: >-
        Nous transmettons notre langue, nos savoirs et nos coutumes aux visiteurs et aux générations futures.
    - title: Apprendre ensemble
      text: >-
        Visiteurs, bénévoles et communauté apprennent les uns des autres : sur les plantes, l’alimentation, la spiritualité et d’autres façons de vivre.
    - title: Renforcer la communauté
      text: >-
        Nous payons les guides et les cuisinières locales, achetons les aliments au sein de la communauté et soutenons financièrement Maikiuants.
quote:
  text: Iikia kampuntniuitji tura achitkiaji ii nekatairijiai.
  translation: "Nous sommes la nature, la connexion et la sagesse."
  source: ""


# Projet : maison culturelle et scientifique (images : visualisations de l’Universidad del Azuay)
culture_house:
  eyebrow: Projet
  title: Maison culturelle et scientifique
  text: >-
    Une maison culturelle et scientifique sera construite à Maikiuants : un lieu où la science et
    la culture shuar sont présentées et conservées. Elle sera construite par étapes et comprendra
    un musée, des laboratoires, un centre éducatif, des bureaux, des dortoirs et un hébergement
    pour les scientifiques, une salle à manger avec cuisine et des toilettes sèches.
  note: "Visualisations du projet : Universidad del Azuay – Consultora de Arquitectura y Urbanismo."
  images:
    - { image: /assets/img/casa-cultural/casa-cultural-1.jpg, alt: "Visualisation : vue aérienne des laboratoires, de l’hébergement pour les scientifiques et de la maison ronde au toit de chaume" }
    - { image: /assets/img/casa-cultural/casa-cultural-3.jpg, alt: "Visualisation : la place centrale avec le musée, les bureaux et le centre éducatif" }
    - { image: /assets/img/casa-cultural/casa-cultural-2.jpg, alt: "Visualisation : dortoirs, salle à manger avec cuisine et toilettes sèches au milieu de la forêt" }
    - { image: /assets/img/casa-cultural/casa-cultural-4.jpg, alt: "Visualisation : visiteurs et membres de la communauté devant les bâtiments en bois" }
    - { image: /assets/img/casa-cultural/casa-cultural-5.jpg, alt: "Visualisation : chemin entre les bâtiments en bois et la maison ronde" }

location:
  title: Où nous trouver
  text: >-
    Maikiuants se trouve dans la province de **Morona Santiago**, dans le sud de l’Amazonie
    équatorienne, dans la Cordillera del Cóndor. La route vers Maikiuants part de **Limón
    Indanza** ; de là, il faut compter environ deux heures et demie, généralement en taxi
    (env. 60–70 USD). Les tours commencent à Limón Indanza, d’où nous voyageons ensemble jusqu’à la communauté ; le mieux est de rejoindre Limón Indanza depuis Cuenca.
    La route n’apparaît pas sur Google Maps, mais elle figure sur OpenStreetMap.
  coords: 3°07'10.2" S · 78°15'56.4" O
  map_link: Voir sur OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"
  labels:
    title: Carte de l’Équateur indiquant l’emplacement de Maikiuants dans le sud de l’Amazonie
    peru: Pérou
    ocean: Océan Pacifique
  region:
    title: "Carte détaillée : la route de Limón Indanza à Maikiuants"

