about:
  title: L’histoire de la communauté
  items:
    - title: Les Shuar
      image: "/assets/img/fotos/shuar.jpg"
      image_alt: Familles shuar de Maikiuants dans la forêt
      text: >-
        Les Shuar sont l’un des peuples autochtones les plus nombreux d’Amazonie. Leur langue est
        le **Shuar Chicham**. Leur vie est profondément liée à la forêt, aux rivières et à la
        spiritualité. La nourriture, les remèdes et les matériaux sont prélevés durablement dans la
        forêt, et les savoirs se transmettent de génération en génération.
    - title: Maikiuants
      image: "/assets/img/fotos/maikiuants.jpg"
      image_position: bottom      # Bild unten ausrichten, damit das Wasserzeichen sichtbar bleibt
      image_alt: Le centre de la communauté de Maikiuants, entouré par la forêt
      text: >-
        Maikiuants est une communauté shuar de la province de Morona Santiago, dans le sud de
        l’Amazonie équatorienne, qui fait partie du **Pueblo Shuar Arutam**. Le village, entouré de
        forêt et de rivières limpides, porte le nom de la rivière qui le traverse : *maikiua* est le
        guanto (trompette des anges), qui pousse tout le long de ses rives, et *ants* signifie
        « eau ». Maikiuants signifie « l’eau du guanto ».
    - title: Kampuntin
      image: "/assets/img/fotos/kampuntin.jpg"
      image_alt: L’équipe de Kampuntin avec un groupe de bénévoles devant la jea
      text: >-
        *Kampuntin* signifie « forêt tropicale » en Shuar Chicham – d’où notre devise
        **« Selva, mi destino »** (la forêt, ma destination). Nous sommes l’organisation qui rend
        possibles les tours et le bénévolat à Maikiuants. Nous étions déjà actifs auparavant, et
        nous sommes officiellement reconnus depuis 2023. Ce qui nous anime, c’est d’apprendre les
        uns des autres et les uns avec les autres. Kampuntin est aussi l’organisation qui porte le
        travail scientifique, le suivi et la protection de la forêt.

# PLACEHOLDER – the mission will be worded in more detail later
mission:
  title: La mission de Kampuntin
  intro: >-
    Kampuntin est l’organisation de tourisme communautaire de Maikiuants. Nous accueillons des
    visiteurs parce que nous voulons protéger ce que nous avons et le partager.
  items:
    - title: Prendre soin de la forêt et la surveiller
      text: >-
        Nous prenons soin de la forêt, des rivières et des animaux de notre territoire et nous les
        surveillons, pour que les générations futures puissent, elles aussi, en vivre et vivre avec
        eux.
    - title: Partager et documenter la culture shuar
      text: >-
        Nous transmettons notre langue, nos savoirs et nos coutumes aux visiteurs et aux
        générations suivantes — et nous documentons notre mode de vie tant que c’est encore
        possible.
    - title: Apprendre ensemble
      text: >-
        Visiteurs, bénévoles et communauté apprennent les uns des autres — sur les plantes, la
        spiritualité et d’autres façons de vivre.
    - title: Renforcer la communauté
      text: >-
        Nous rémunérons des guides et des cuisinières de la communauté, achetons la nourriture sur
        place, et 5 % des revenus vont directement à Maikiuants. Nous aidons aussi les familles dans
        le besoin en matière de santé et d’éducation.

quote:
  text: Iikia kampuntniuitji tura achitkiaji ii nekatairijiai.
  translation: Nous sommes nature, lien et sagesse.
  source: La communauté de Maikiuants

location:
  title: Où nous trouver
  text: >-
    Maikiuants se trouve dans la province de **Morona Santiago**, dans le sud de l’Amazonie
    équatorienne, dans la Cordillera del Cóndor. La route vers Maikiuants part de **Limón
    Indanza** ; de là, il faut compter environ deux heures et demie, généralement en taxi 4×4
    (env. 50–60 USD). Nous accueillons les groupes des tours à Quito et voyageons ensemble jusqu’à
    la communauté.
  coords: 3°07'10.2" S · 78°15'56.4" O
  map_link: Voir sur OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"
  labels:
    title: Carte de l’Équateur indiquant l’emplacement de Maikiuants dans le sud de l’Amazonie
    peru: Pérou
    ocean: Océan Pacifique
  region:
    title: "Carte détaillée : la route de Limón Indanza à Maikiuants"

explore:
  title: Découvrir Maikiuants
  intro: Choisissez par où commencer.
  items:
    - ref: tours
      title: Tours
      text: Dix jours dans la forêt pour des groupes de 12 personnes maximum, en partageant la vie de la communauté.
    - ref: volunteering
      title: Bénévolat
      text: Jardinage, agroforesterie, mingas et construction, en vivant dans une jea traditionnelle au cœur de la forêt.
    - ref: science
      title: Science
      text: Des paraécologues de la communauté suivent la biodiversité, les rivières et le climat.

