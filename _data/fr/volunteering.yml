# Page bénévolat – français (d’après le profil WWOOF)
# Le texte entre [crochets] est un marqueur : à remplacer par les vraies informations.

hero:
  eyebrow: Bénévolat
  title: Bénévolat à Maikiuants
  lead: >-
    Rejoignez-nous à Maikiuants pour travailler, apprendre et vivre ensemble.
  image: "/assets/img/fotos/hero-voluntariado.jpg"
  image_alt: Des bénévoles avec des machettes à côté d’un membre de la communauté

who:
  title: "Nous recherchons des personnes qui souhaitent…"
  items:
    - apprendre sur les plantes, l’agroforesterie et la permaculture
    - vivre en groupe et partager les tâches
    - découvrir la culture shuar et la vie dans la forêt
    - passer beaucoup de temps en plein air
    - vivre un quotidien lent, calme et souple
    - être ouvert d’esprit, respectueux et souple


tasks:
  title: "Comment vous aiderez"
  intro: >-
    Nous vous invitons à aider là où l’on a besoin de vous et à apporter vos propres idées et compétences. Voici quelques tâches auxquelles vous pourriez participer :
  items:
    - title: "Pépinière et jardin"
      text: "Pépinière, semis et entretien du jardin et du terrain autour de la maison."
    - title: "Agroforesterie"
      text: "Entretenir les cultures agroforestières : désherbage, taille et récolte."
    - title: "Construction"
      text: "Soutien aux travaux de construction et aux améliorations des infrastructures."
    - title: "Minga"
      text: "Journées de travail collectif dans le village de Maikiuants."
    - title: "Vos compétences"
      text: "Apportez vos propres compétences, par exemple la couture, les réseaux sociaux ou les vidéos. Vous pouvez aussi aider avec votre langue, par des traductions ou en enseignant des langues. Chaque initiative est la bienvenue."


life:
  title: La vie dans la jea
  text: |-
    Nous dormons dans une maison traditionnelle appelée **jea**, en pleine forêt. Il y a des
    lits superposés sur trois niveaux et la possibilité d’accrocher un hamac. La douche est la
    meilleure du monde : une rivière pure à l’eau fraîche.

    Une cuisine bien équipée est à votre disposition. Un panneau solaire l’alimente en
    électricité, et il y a un mixeur et une centrifugeuse. À l’avenir, nous prévoyons d’installer
    un petit réfrigérateur pour conserver les aliments. Les repas sont généralement partagés avec
    les autres bénévoles.
  # The 6 photos are in _data/jea_photos.yml (shared with the tours page)

free_time:
  title: Temps libre
  text: >-
    Pendant votre temps libre, vous pouvez profiter des environs : nous pouvons vous emmener faire
    de belles balades, vous pouvez jouer avec les enfants, participer à la fabrication de
    poteries, faire de l’artisanat, jouer de la musique et chanter. Vous pouvez aussi profiter de votre temps libre pour apprendre, lire et méditer.
  quote: C’est un lieu de créativité et de liberté où tout est possible.

practical:
  title: Informations pratiques
  items:
    - { label: Durée du séjour, value: "Au moins un mois (des séjours plus courts de 2 à 3 semaines sont possibles après accord) – sans limite" }
    - { label: Horaires de travail, value: "Flexibles, 3 à 5 h par jour, 5 jours par semaine" }
    - label: Nourriture
      value: >-
        Apportez de quoi manger au moins pour la première semaine, pour cuisiner avec les 2 ou 3
        membres de la communauté avec qui vous vivez. Ici poussent des bananes et des bananes
        plantain, et une petite boutique de la communauté vend des produits de base. Prévoyez aussi
        de l’argent liquide en plus pour les courses et le taxi depuis Limón Indanza qui vous apportera la nourriture. Il y a une
        solution à tout, et les gens sont toujours prêts à aider.
    - { label: Langues, value: "Espagnol et Shuar Chicham – presque aucune autre langue. Quelques bases d’espagnol aident beaucoup" }
    - { label: Arrivée, value: "En bus jusqu’à Limón Indanza, puis environ 2 h 30 en taxi (env. 60–70 USD) jusqu’à la communauté" }
  wwoof: Retrouvez-nous aussi sur WWOOF

apply:
  title: Comment postuler
  steps:
    - title: Présentez-vous
      text: Dites-nous qui vous êtes, ce qui vous motive et quand vous aimeriez venir.
    - title: Confirmation
      text: Nous convenons des dates et des autres détails.
    - title: Bienvenue !
      text: Nous vous accueillons à l’hébergement et vous faisons découvrir les lieux.
  button: Je veux devenir bénévole

# Erfahrungsberichte (nur mit Einverständnis der Personen veröffentlichen)
testimonials:
  title: Témoignages de bénévoles
  intro: Ce que racontent les personnes qui ont déjà passé du temps à Maikiuants.
  # quote = short quote (always visible) · text = full story to expand (optional, any length)
  items:
    - quote: >-
        Ce qui m’a le plus plu, c’est à quel point on peut s’immerger dans la vie de la communauté, si on en a envie.
      name: "Anouk"
      meta: "Bénévolat · octobre 2026"
      photo: ""
      text: |-
        En octobre 2026, j’ai passé trois semaines à Maikiuants avec trois ami·es, et cette expérience compte beaucoup pour moi. Ce qui m’a le plus plu, c’est à quel point on peut s’immerger dans la vie de la communauté, si on en a envie. Après les mingas, les journées de travail collectif, il y a toujours une réunion où l’on discute des sujets du moment et où les décisions sont prises avec le dirigeant de la communauté. C’est bien sûr plus intéressant si l’on comprend la langue, mais c’est tout de même agréable de pouvoir y assister et écouter. On se fait ainsi une idée de la façon dont la communauté s’organise.

        Nous étions quatre et avons passé la plupart du temps à travailler sur un site web. Entre-temps, nous sommes allés en forêt, avons participé à deux mingas et fait quelques petites excursions. Si l’agriculture ne vous attire pas, vous pouvez aussi aider dans le domaine numérique, par exemple en filmant ou en photographiant.

        L’expérience est passionnante quelle que soit la langue que l’on parle, mais avec un peu d’espagnol, on en retire beaucoup plus, et c’est tellement plus agréable de pouvoir parler directement avec les gens : ici, presque personne ne parle anglais. Dans notre groupe, trois personnes parlaient à peine espagnol et une un peu plus, ce qui a suffi pour traduire les unes pour les autres. Sans ces bases, beaucoup de choses se seraient sans doute perdues.

        Nous avons vécu avec Jessica. Elle dormait chez nous et partageait tous nos repas. Même si notre logement était à environ une demi-heure du village, nous avions ainsi toujours quelqu’un à qui poser nos questions, à tout moment. Une relation vraiment personnelle s’est créée. Jessica était très ouverte, et vivre avec elle a été merveilleux. Un grand merci à elle !

        Tout le monde a été incroyablement gentil. Quand nous voulions cuisiner au village, Marcos nous a souvent laissé utiliser sa cuisine. En général, presque tout peut s’organiser ici d’une manière ou d’une autre : en cas de problème ou de souhait, il suffit d’en parler ouvertement.

        Mes conseils pour les futur·es bénévoles : apportez de quoi manger pour la première semaine ; sur place, il y a surtout des bananes plantain et du manioc, et les petites boutiques n’ont pas grand-chose d’autre, alors achetez avant ce que vous souhaitez avoir. Restez au moins trois semaines pour vraiment arriver, vous intégrer et connaître la communauté. Et apprenez l’espagnol : même des bases font une grande différence.
    - quote: >-
        Ce que j’ai le plus apprécié, c’est que tout ne suivait pas un horaire fixe : la journée pouvait se dérouler naturellement.
      name: "Yael"
      meta: "Bénévolat · octobre 2026"
      photo: ""
      text: |-
        Mon séjour à Maikiuants a été marqué par le rythme de vie lent et paisible. Ce que j’ai particulièrement apprécié, c’est que tout ne suivait pas un horaire fixe. Chaque journée pouvait se dérouler naturellement, selon l’humeur des gens, la météo et les tâches à accomplir.

        Au bout de quelques jours, les 30 minutes de marche jusqu’à la communauté ne me dérangeaient plus, et on nous emmenait souvent à moto, ce qui rendait le trajet encore plus agréable. Les gens de la communauté ont été incroyablement accueillants, ouverts et serviables. Ils m’ont montré tant de choses merveilleuses et intéressantes, et j’ai beaucoup appris.

        On nous a donné beaucoup de manioc, de bananes plantain et de bananes douces, que nous avons pu aider à récolter. Deux membres de la communauté passaient les journées avec nous et nous ont peu à peu tout fait découvrir : la forêt, la communauté et les communautés voisines. Nous nous sommes vite sentis chez nous.

        J’avais aussi beaucoup de liberté dans le travail. Je pouvais en grande partie choisir ce que je voulais faire et organiser mes tâches avec souplesse, si bien que le travail ressemblait moins à une obligation qu’à un loisir que j’aimais vraiment.

        Mon séjour dans la communauté et à la jea a été très précieux pour moi. J’ai vécu beaucoup d’expériences nouvelles, rencontré des personnes intéressantes et appris des choses que je garderai avec moi longtemps après mon départ.
    - quote: >-
        Si vous êtes ouvert à une vie simple et naturelle, à l’échange culturel et que vous aimez l’imprévu, vous vivrez sans aucun doute une belle expérience.
      name: "Lotte"
      meta: "Bénévolat · août 2025"
      photo: ""
      text: |-
        Il y a quelques mois, nous avons passé un mois avec les Shuar. C’est une période dont je garde un très beau souvenir et une expérience vraiment précieuse. À 20 minutes à pied du village où vivent les Shuar, nous dormions dans une maison traditionnelle près de la rivière, entourés d’une nature belle et fascinante et des sons merveilleux de la forêt.

        Chaque matin, nous marchions jusqu’au village pour aider au projet d’agroforesterie. Nous avons beaucoup appris sur les plantes et la manière de les planter, sur les relations écologiques et les défis locaux. Le quotidien était détendu, et parfois nous allions au cœur de la forêt, jusqu’aux cascades, pour découvrir les traditions et nous faire une idée des vastes connaissances des Shuar sur la forêt. Je pense que ce que font les bénévoles là-bas est sans doute toujours différent et peut être autre chose que ce que nous avons fait. Quoi qu’il en soit, nous recommandons de rester au moins 3 semaines pour créer un lien avec la famille, les enfants et les autres personnes. Tout prend son temps…

        Beaucoup d’expériences fantastiques ne sont pas mentionnées ici, mais si vous êtes ouvert à une vie simple et naturelle, à l’échange culturel et que vous aimez l’imprévu, vous vivrez sans aucun doute une belle expérience.

        Salutations à Nancy et Pinchu, Estrella, Kilian et Kirup, à Freddy, Numi et Julien !

        Dino et Lotz

faq:
  title: Questions fréquentes
  items:
    - q: Combien coûte le bénévolat ?
      a: >-
        L’hébergement dans la jea est offert en échange de votre travail. Prévoyez un peu d’argent
        pour le taxi depuis Limón Indanza et pour acheter votre nourriture (voir « Informations
        pratiques »).
    - q: Faut-il de l’expérience en agriculture ou en construction ?
      a: >-
        Non. Ce qui compte, c’est l’envie d’apprendre et de travailler. Nous vous apprendrons sur
        place tout ce dont vous avez besoin.
    - q: Faut-il parler espagnol ?
      a: >-
        Presque personne dans la communauté ne parle anglais, donc un niveau d’espagnol de base aide beaucoup à vivre ensemble.
    - q: À quoi ressemble une journée type ?
      a: >-
        Chaque jour est différent. Il n’y a souvent pas de programme fixe et beaucoup de choses se
        font spontanément. N’hésitez pas à apporter vos propres envies et idées : ensemble, nous
        voyons ce qui est possible.
    - q: Y a-t-il Internet et de l’électricité ?
      a: >-
        La cuisine fonctionne à l’énergie solaire et vous pouvez y recharger votre téléphone. Il n’y
        a ni Wi-Fi ni réseau téléphonique dans la maison où vous vivez, mais vous pouvez marcher
        environ 35 minutes jusqu’au village et y utiliser le Wi-Fi gratuit.
    - q: De quels vaccins et de quelle assurance ai-je besoin ?
      a: >-
        Une assurance voyage avec couverture médicale est obligatoire. Consultez un médecin
        spécialisé en médecine des voyages ; pour l’Amazonie, les vaccins contre la fièvre jaune,
        la fièvre typhoïde, les hépatites A et B et la rage sont généralement très importants.
    - q: Puis-je venir en couple, en famille ou entre amis ?
      a: >-
        Oui, écrivez-nous suffisamment tôt. Le logement peut accueillir 12 personnes.
