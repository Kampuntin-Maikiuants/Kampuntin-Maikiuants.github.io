faq:
  title: Questions fréquentes
  items:
    - q: Combien coûte le bénévolat ?
      a: >-
        L’hébergement dans la jea est offert en échange de votre travail. Prévoyez un peu d’argent
        pour le taxi depuis Limón Indanza et pour acheter votre nourriture (voir « Informations
        pratiques »).
    - q: Faut-il de l’expérience en agriculture ou en construction ?
      a: >-
        Non. Ce qui compte, c’est l’envie d’apprendre et de travailler. Nous vous apprendrons sur
        place tout ce dont vous avez besoin.
    - q: Faut-il parler espagnol ?
      a: >-
        Presque personne dans la communauté ne parle anglais, donc un niveau d’espagnol de base aide beaucoup à vivre ensemble.
    - q: À quoi ressemble une journée type ?
      a: >-
        Chaque jour est différent. Il n’y a souvent pas de programme fixe et beaucoup de choses se
        font spontanément. N’hésitez pas à apporter vos propres envies et idées : ensemble, nous
        voyons ce qui est possible.
    - q: Y a-t-il Internet et de l’électricité ?
      a: >-
        La cuisine fonctionne à l’énergie solaire et vous pouvez y recharger votre téléphone. Il n’y
        a ni Wi-Fi ni réseau téléphonique dans la maison où vous vivez, mais vous pouvez marcher
        environ 35 minutes jusqu’au village et y utiliser le Wi-Fi gratuit.
    - q: De quels vaccins et de quelle assurance ai-je besoin ?
      a: >-
        Une assurance voyage avec couverture médicale est obligatoire. Consultez un médecin
        spécialisé en médecine des voyages ; pour l’Amazonie, les vaccins contre la fièvre jaune,
        la fièvre typhoïde, les hépatites A et B et la rage sont généralement très importants.
    - q: Puis-je venir en couple ou entre amis ?
      a: >-
        Oui, écrivez-nous suffisamment tôt. Le logement peut accueillir 12 personnes.
