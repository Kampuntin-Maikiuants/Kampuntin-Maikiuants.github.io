# Page bénévolat – français (d’après le profil WWOOF)
# Le texte entre [crochets] est un marqueur : à remplacer par les vraies informations.

hero:
  eyebrow: Bénévolat
  title: Bénévolat à Maikiuants
  lead: >-
    Rejoignez-nous à Maikiuants pour travailler, apprendre et vivre ensemble.
  image: "/assets/img/fotos/hero-voluntariado.jpg"
  image_alt: Des bénévoles avec des machettes à côté d’un membre de la communauté

who:
  title: "Nous recherchons des personnes qui souhaitent"
  items:
    - apprendre sur les plantes, l’agroforesterie et la permaculture,
    - vivre en groupe et partager les tâches,
    - découvrir la culture shuar et la vie dans la forêt,
    - passer beaucoup de temps en plein air,
    - vivre un quotidien lent, calme et souple,
    - être ouvert d’esprit, respectueux et souple.


tasks:
  title: "Comment vous aiderez"
  intro: >-
    Nous vous invitons à aider là où l’on a besoin de vous et à apporter vos propres idées et compétences. Voici quelques tâches auxquelles vous pourriez participer :
  items:
    - title: "Pépinière et jardin"
      text: "Pépinière, semis et entretien du jardin et du terrain autour de la maison."
    - title: "Agroforesterie"
      text: "Entretenir les cultures agroforestières : désherbage, taille et récolte."
    - title: "Construction"
      text: "Soutien aux travaux de construction et aux améliorations des infrastructures."
    - title: "Minga"
      text: "Journées de travail collectif dans le village de Maikiuants."
    - title: "Vos compétences"
      text: "Apportez vos propres compétences, par exemple la couture, les réseaux sociaux ou les vidéos, etc. Chaque initiative est la bienvenue."


life:
  title: La vie dans la jea
  text: |-
    Nous dormons dans une maison traditionnelle appelée **jea**, en pleine forêt. Il y a des
    lits superposés sur trois niveaux et la possibilité d’accrocher un hamac. La douche est la
    meilleure du monde : une rivière pure à l’eau fraîche.

    Une cuisine bien équipée est à votre disposition. Un panneau solaire l’alimente en
    électricité, et il y a un mixeur et une centrifugeuse. À l’avenir, nous prévoyons d’installer
    un petit réfrigérateur pour conserver les aliments. Les repas sont généralement partagés avec
    les autres bénévoles.
  # The 6 photos are in _data/jea_photos.yml (shared with the tours page)

free_time:
  title: Temps libre
  text: >-
    Pendant votre temps libre, vous pouvez profiter des environs : nous pouvons vous emmener faire
    de belles balades, vous pouvez jouer avec les enfants, participer à la fabrication de
    poteries, faire de l’artisanat, jouer de la musique et chanter.
  quote: C’est un lieu de créativité et de liberté où tout est possible.

practical:
  title: Informations pratiques
  items:
    - { label: Durée du séjour, value: "Au moins un mois (des séjours plus courts de 2 à 3 semaines sont possibles après accord) – pas de durée maximale" }
    - { label: Horaires de travail, value: "Flexibles, 3 à 5 h par jour, 5 jours par semaine" }
    - label: Nourriture
      value: >-
        Apportez de quoi manger au moins pour la première semaine, pour cuisiner avec les 2 ou 3
        membres de la communauté avec qui vous vivez. Ici poussent des bananes et des bananes
        plantain, et une petite boutique de la communauté vend des produits de base. Prévoyez aussi
        de l’argent liquide en plus pour les courses et le taxi depuis Limón Indanza. Il y a une
        solution à tout, et les gens sont toujours prêts à aider.
    - { label: Langues, value: "Espagnol et Shuar Chicham – presque aucune autre langue. Quelques bases d’espagnol aident beaucoup" }
    - { label: Arrivée, value: "En bus jusqu’à Limón Indanza, puis environ 2 h 30 en taxi (env. 50–60 USD) jusqu’à la communauté" }
  wwoof: Retrouvez-nous aussi sur WWOOF

apply:
  title: Comment postuler
  steps:
    - title: Présentez-vous
      text: Dites-nous qui vous êtes, ce qui vous motive et quand vous aimeriez venir.
    - title: Confirmation
      text: Nous convenons des dates et des autres détails.
    - title: Bienvenue !
      text: Nous vous accueillons à l’hébergement et vous faisons découvrir les lieux.
  button: Je veux devenir bénévole

