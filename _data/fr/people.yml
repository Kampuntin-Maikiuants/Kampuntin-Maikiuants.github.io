# Page équipe – français (les personnes elles-mêmes sont dans _data/team.yml)
hero:
  eyebrow: Équipe
  title: "Les personnes derrière Kampuntin"
  lead: >-
    Derrière Kampuntin, il y a une petite équipe : des personnes qui coordonnent les tours et le
    bénévolat, vous guident dans la forêt et s’occupent de vous pendant votre séjour.
  image: "/assets/img/ilustraciones/detalle-3.jpg"
  image_alt: Illustration de plantes de la forêt amazonienne
groups:
  community: De la communauté
  kampuntin: "Kampuntin : votre équipe à Maikiuants"

# Dernière carte de l’équipe : toutes les autres personnes de la communauté qui participent
more_people:
  image: /assets/img/equipo/comunidad.jpg
  title: Et bien d’autres personnes
  role: De la communauté de Maikiuants
  text: >-
    En plus de l’équipe, de nombreuses personnes de la communauté participent : guides,
    cuisinières, artisanes et familles. Vous les rencontrerez à Maikiuants et serez en contact avec
    elles pendant tout votre séjour.

