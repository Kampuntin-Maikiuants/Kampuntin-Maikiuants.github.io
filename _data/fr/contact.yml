# Page de contact – français
hero:
  eyebrow: Contact
  title: Écrivez-nous
  lead: >-
    Des questions sur les tours, le bénévolat ou une collaboration scientifique ? Écrivez-nous sur WhatsApp ou par e-mail. Nous répondons personnellement, généralement dans la journée. Le réseau est limité dans la forêt, merci de votre patience.
  image: "/assets/img/ilustraciones/detalle-4.jpg"
  image_alt: Illustration de plantes de la forêt amazonienne
direct:
  whatsapp: WhatsApp
  whatsapp_cta: WhatsApp
  email: E-mail
  email_hint: "E-mail général :"
  tips_title: Pour que nous puissions vous répondre rapidement, dites-nous
  tips:
    - si un tour, le bénévolat ou autre chose vous intéresse,
    - les dates que vous envisagez,
    - combien de personnes viendront,
    - et quelques mots sur vous.
location:
  title: Où nous trouver
  text: >-
    Maikiuants se trouve dans la province de Morona Santiago, dans le sud de l’Amazonie
    équatorienne. La route vers la communauté part de Limón Indanza ; de là, il faut compter
    environ deux heures et demie, généralement en taxi (env. 60–70 USD). Les tours commencent et se terminent à Limón Indanza ; le mieux est d’y arriver depuis Cuenca. Nous convenons des autres détails du voyage avec vous avant votre
    arrivée.
    La route n’apparaît pas sur Google Maps, mais elle figure sur OpenStreetMap.
  map_link: Voir sur OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"

faq:
  title: Questions fréquentes
  items:
    - q: En combien de temps répondez-vous ?
      a: >-
        Généralement en quelques jours. Le réseau est limité dans la forêt, donc cela peut parfois prendre un peu plus de temps. N’oubliez pas qu’il peut y avoir un décalage horaire. Par WhatsApp, c’est souvent plus rapide.
    - q: Dans quelles langues puis-je vous écrire ?
      a: >-
        Le mieux est l’espagnol. Si vous ne le parlez pas, écrivez-nous quand même : nous traduirons votre message.
    - q: Comment vous soutenir sans voyager ?
      a: >-
        En partageant nos actualités ou en nous aidant pour la traduction, la photographie ou les
        réseaux sociaux. Avec une partie de ses revenus, Kampuntin apporte déjà un soutien social
        aux familles de la communauté pour la santé, l’éducation et les besoins urgents. Si vous
        souhaitez soutenir ce travail par un don, n’hésitez pas à nous contacter.
