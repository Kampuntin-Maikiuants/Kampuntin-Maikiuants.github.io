# Page de contact – français
hero:
  eyebrow: Contact
  title: Écrivez-nous
  lead: >-
    Des questions sur les tours, le bénévolat ou une collaboration scientifique ? Écrivez-nous sur
    WhatsApp ou par e-mail. Nous répondons personnellement ; le réseau est limité dans la forêt,
    merci donc de votre patience.
  image: "/assets/img/ilustraciones/detalle-4.jpg"
  image_alt: Illustration de plantes de la forêt amazonienne
direct:
  whatsapp: WhatsApp
  whatsapp_cta: WhatsApp
  email: E-mail
  email_hint: "E-mail général :"
  tips_title: Pour que nous puissions vous répondre rapidement, dites-nous
