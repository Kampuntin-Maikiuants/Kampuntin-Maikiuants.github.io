# Videos für die Galerie
# -----------------------------------------------------------------
# Zwei Möglichkeiten pro Video:
#   file:    eigene MP4-Datei in assets/video/ (unter 50 MB halten!), dazu ein Vorschaubild (poster)
#   youtube: Video-ID aus dem YouTube-Link, z. B. https://youtu.be/AbCdEf12345 -> AbCdEf12345
#            (lädt erst nach Klick – Datenschutz). Für lange Videos die bessere Wahl.

- file: /assets/video/maikiuants-uso-de-suelo.mp4
  poster: /assets/video/maikiuants-uso-de-suelo.jpg
  title:
    es: "Caracterización de la cobertura de uso de suelo"
    en: "Mapping land use and vegetation cover"
    fr: "Cartographie de l’usage des sols et de la couverture végétale"
  text:
    es: >-
      Un proyecto de los paraecólogos de Maikiuants junto con la Universidad del Azuay: con GPS,
      drones y sistemas de información geográfica documentamos cómo se usa el suelo y cómo está
      la vegetación en nuestro territorio. (subtítulos en inglés)
    en: >-
      A project by the Maikiuants para-ecologists together with the Universidad del Azuay: using
      GPS, drones and geographic information systems, we document how land is used and the state
      of the vegetation in our territory. (English subtitles)
    fr: >-
      Un projet des paraécologues de Maikiuants avec l’Universidad del Azuay : avec le GPS, des
      drones et des systèmes d’information géographique, nous documentons l’usage des sols et
      l’état de la végétation sur notre territoire. (sous-titres en anglais)

- file: /assets/video/oso-andino-1.mp4
  poster: /assets/video/oso-andino-1.jpg
  title:
    es: "Oso andino en la cámara trampa"
    en: "Andean bear on a camera trap"
    fr: "Ours à lunettes devant un piège photographique"
  text:
    es: "El oso andino, una especie en peligro de extinción, pasa frente a una cámara trampa."
    en: "The Andean bear, an endangered species, walks past a camera trap."
    fr: "L’ours à lunettes, une espèce en danger, passe devant un piège photographique."

- file: /assets/video/oso-andino-2.mp4
  poster: /assets/video/oso-andino-2.jpg
  title:
    es: "Un oso curioso"
    en: "A curious bear"
    fr: "Un ours curieux"
  text:
    es: "El oso se acerca y olfatea la cámara trampa."
    en: "The bear comes closer and sniffs the camera trap."
    fr: "L’ours s’approche et renifle le piège photographique."

- file: /assets/video/oso-andino-3.mp4
  poster: /assets/video/oso-andino-3.jpg
  title:
    es: "Oso andino en el bosque"
    en: "Andean bear in the forest"
    fr: "Ours à lunettes en forêt"
  text:
    es: "Un oso andino cruza el bosque frente a la cámara trampa."
    en: "An Andean bear crosses the forest in front of the camera trap."
    fr: "Un ours à lunettes traverse la forêt devant le piège photographique."

- file: /assets/video/rana-nueva.mp4
  poster: /assets/video/rana-nueva.jpg
  title:
    es: "¿Una especie nueva para la ciencia?"
    en: "A new species for science?"
    fr: "Une nouvelle espèce pour la science ?"
  text:
    es: "La rana de Maikiuants que podría ser una especie nueva (nombre propuesto: Rhinella maikiuants)."
    en: "The Maikiuants frog that may be a new species (proposed name: Rhinella maikiuants)."
    fr: "Le crapaud de Maikiuants qui pourrait être une nouvelle espèce (nom proposé : Rhinella maikiuants)."
