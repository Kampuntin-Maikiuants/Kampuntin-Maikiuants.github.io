    es: "Emprendedor comercial con su tienda de víveres y gestor digital."
    en: "A business entrepreneur with his grocery shop and a digital manager."
    fr: "Entrepreneur commercial avec son épicerie et gestionnaire numérique."
  details:
    es: "Marcos es emprendedor comercial con su tienda de víveres. También es gestor digital."
    en: "Marcos is a business entrepreneur with his grocery shop. He is also a digital manager."
    fr: "Marcos est entrepreneur commercial avec son épicerie. Il est aussi gestionnaire numérique."

- name: "Eddy Ankuash"
  group: kampuntin
  photo: "/assets/img/equipo/eddy.jpg"
  social:
    - { name: Facebook, url: "https://www.facebook.com/eddy.ankuash.2025" }
  role: { es: "Secretario de Kampuntin", en: "Secretary of Kampuntin", fr: "Secrétaire de Kampuntin" }
  bio:
    es: "Es emprendedor en la agricultura y la carpintería."
    en: "An entrepreneur in agriculture and carpentry."
    fr: "Entrepreneur dans l’agriculture et la menuiserie."
  details:
    es: "Eddy es emprendedor en la agricultura y la carpintería. Cultiva plátano, yuca y caña de azúcar. Los visitantes y los voluntarios pueden cosechar junto con él."
    en: "Eddy is an entrepreneur in agriculture and carpentry. He grows bananas, cassava and sugarcane. Visitors and volunteers can harvest together with him."
    fr: "Eddy est entrepreneur dans l’agriculture et la menuiserie. Il cultive bananes, manioc et canne à sucre. Les visiteurs et les bénévoles peuvent récolter avec lui."

- name: "Jessica"
  group: kampuntin
  photo: "/assets/img/equipo/jessica.jpg"
  social:
    - { name: Instagram, url: "https://www.instagram.com/_sjesz/" }
  role: { es: "Voluntaria y parte de la comunidad", en: "Volunteer and community member", fr: "Bénévole et membre de la communauté" }
  bio:
    es: "Vive con los grupos de voluntarios y ayuda en los tours."
    en: "Lives together with the volunteer groups and helps with the tours."
    fr: "Vit avec les groupes de bénévoles et aide lors des tours."
  details:
    es: "Jessica vive con los grupos de voluntarios, ayuda en los tours y acerca la cultura de la comunidad a los visitantes y a los voluntarios."
    en: "Jessica lives together with the volunteer groups, helps with the tours and brings the local culture closer to visitors and volunteers."
    fr: "Jessica vit avec les groupes de bénévoles, aide lors des tours et rapproche la culture locale des visiteurs et des bénévoles."

- name: "Numi"
  group: kampuntin
  photo: "/assets/img/equipo/numi.jpg"
  social:
    - { name: Facebook, url: "https://www.facebook.com/profile.php?id=61560174250559" }
  role: { es: "Guía · naturaleza", en: "Guide · nature", fr: "Guide · nature" }
  bio:
    es: "Guía las caminatas por la selva y comparte su conocimiento sobre las plantas y los animales del territorio."
    en: "Leads the rainforest walks and shares his knowledge of the plants and animals of the territory."
    fr: "Guide les randonnées en forêt et partage ses connaissances sur les plantes et les animaux du territoire."

- name: "Elvia Ankuash"
  group: kampuntin
  photo: ""
  social:
    - { name: Facebook, url: "https://www.facebook.com/elvia.ankuash" }
  role: { es: "Cerámica y artesanía", en: "Pottery and handicrafts", fr: "Céramique et artisanat" }
  bio:
    es: "Hace cerámica con los visitantes y artesanía con cuentas, como collares."
    en: "Makes pottery with visitors and beadwork such as necklaces."
    fr: "Fait de la céramique avec les visiteurs et de l’artisanat en perles, comme des colliers."
  details:
    es: "Elvia es alfarera: hace cerámica junto con los visitantes y los voluntarios. También hace artesanía, como collares y otras piezas con cuentas."
    en: "Elvia is a potter: she makes ceramics together with visitors and volunteers. She also makes handicrafts such as necklaces and other beadwork."
    fr: "Elvia est potière : elle fait de la céramique avec les visiteurs et les bénévoles. Elle fabrique aussi de l’artisanat, comme des colliers et d’autres bijoux en perles."
