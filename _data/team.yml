- name: "Marcos Ankuash"
  group: kampuntin
  photo: ""
  role: { es: "Dueño de la tienda del pueblo", en: "Owner of the village shop", fr: "Propriétaire de la petite épicerie du village" }
  bio:
    es: "Tiene la pequeña tienda del pueblo y apoya las excursiones y las visitas guiadas por el pueblo."
    en: "Runs the small shop in the village and supports the excursions and village tours."
    fr: "Tient la petite épicerie du village et soutient les excursions et les visites du village."
  details:
    es: "Marcos es dueño de la pequeña tienda del pueblo. Apoya las excursiones y guía visitas por el pueblo."
    en: "Marcos owns the small shop in the village. He supports the excursions and leads village tours."
    fr: "Marcos tient la petite épicerie du village. Il soutient les excursions et guide les visites du village."

- name: "Eddy Ankuash"
  group: kampuntin
  photo: ""
  role: { es: "Dueño de un aserradero y de plantaciones", en: "Owner of a sawmill and of plantations", fr: "Propriétaire d’une scierie et de plantations" }
  bio:
    es: "Tiene un aserradero y cultiva plátano, yuca y caña de azúcar, que cosechamos juntos."
    en: "Runs a sawmill and grows bananas, cassava and sugarcane, which we harvest together."
    fr: "Possède une scierie et cultive bananes, manioc et canne à sucre, que nous récoltons ensemble."
  details:
    es: "Eddy es dueño de un aserradero y cultiva plátano, yuca y caña de azúcar en sus plantaciones. Los visitantes y los voluntarios pueden cosechar junto con él."
    en: "Eddy owns a sawmill and grows bananas, cassava and sugarcane on his plantations. Visitors and volunteers can harvest together with him."
    fr: "Eddy possède une scierie et cultive bananes, manioc et canne à sucre dans ses plantations. Les visiteurs et les bénévoles peuvent récolter avec lui."

- name: "Jessica [Apellido]"
  group: kampuntin
  photo: ""
  role: { es: "Voluntaria y parte de la comunidad", en: "Volunteer and community member", fr: "Bénévole et membre de la communauté" }
  bio:
    es: "Vive con los grupos de voluntarios y ayuda en los tours."
    en: "Lives together with the volunteer groups and helps with the tours."
    fr: "Vit avec les groupes de bénévoles et aide lors des tours."
  details:
    es: "Jessica también es voluntaria. Vive con los grupos de voluntarios, ayuda en los tours y acerca la cultura de la comunidad a los visitantes y a los voluntarios."
    en: "Jessica is also a volunteer. She lives together with the volunteer groups, helps with the tours and brings the local culture closer to visitors and volunteers."
    fr: "Jessica est aussi bénévole. Elle vit avec les groupes de bénévoles, aide lors des tours et rapproche la culture locale des visiteurs et des bénévoles."

- name: "Numi"
  group: kampuntin
  photo: "/assets/img/equipo/numi.jpg"
  role: { es: "Guía · naturaleza", en: "Guide · nature", fr: "Guide · nature" }
  bio:
    es: "Guía las caminatas por la selva y comparte su conocimiento sobre las plantas y los animales del territorio."
    en: "Leads the rainforest walks and shares their knowledge of the plants and animals of the territory."
    fr: "Guide les randonnées en forêt et partage ses connaissances sur les plantes et les animaux du territoire."
