# Personen auf der Seite „Equipo / People“
# Texte dürfen **fett**, *kursiv* und [Links](https://...) enthalten.
# group: kampuntin (Organisationsteam) oder community. "details" (optional) ist die ausführliche Beschreibung und ersetzt auf der Seite die kurze "bio".
# photo: optional, z. B. /assets/img/equipo/nombre.jpg (quadratisch, ca. 600×600 px)
# shuar_name: optional, Shuar-Name unter dem Namen.
# social: optional, Links zu Instagram/Facebook der Person (name, handle optional, url).
# Keine Telefonnummern oder E-Mails hier. contact: true zeigt den Link zur Kontaktseite (nur bei den Ansprechpersonen).
# WICHTIG: Nur mit Einverständnis der Person veröffentlichen.

- name: "Freddy Ankuash"
  contact: true
  shuar_name: "Nenkas Chicham"
  group: kampuntin
  photo: "/assets/img/equipo/freddy.jpg"
  social:
    - { name: Instagram, url: "https://www.instagram.com/nekas_chicham/" }
  role: { es: "Gerente y coordinación de Kampuntin", en: "Manager and coordinator of Kampuntin", fr: "Gérant et coordinateur de Kampuntin" }
  bio:
    es: "Coordina a los voluntarios y a los grupos de los tours, y planifica las excursiones."
    en: "Coordinates the volunteers and tour groups and plans the excursions."
    fr: "Coordonne les bénévoles et les groupes des tours et organise les excursions."
  details:
    es: "Freddy coordina a los voluntarios y a los grupos de los tours. Planifica las excursiones y es tu guía local."
    en: "Freddy coordinates the volunteers and tour groups. He plans the excursions and is your local guide."
    fr: "Freddy coordonne les bénévoles et les groupes des tours. Il organise les excursions et est votre guide local."

- name: "Julien Defourny"
  shuar_name: "Shakaim"
  contact: true
  group: kampuntin
  photo: "/assets/img/equipo/julien.jpg"
  role: { es: "Fundador de Raíces · guía y traductor", en: "Founder of Raíces · guide and translator", fr: "Fondateur de Raíces · guide et traducteur" }
  bio:
    es: "Fundó la asociación belga Raíces y acompaña los tours como guía y traductor."
    en: "Founded the Belgian association Raíces and accompanies the tours as guide and translator."
    fr: "A fondé l’association belge Raíces et accompagne les tours comme guide et traducteur."
  details:
    es: "Julien fundó la asociación belga [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"} y conoce a los shuar desde 2017. Acompaña los tours como guía y traductor y es tu contacto si vienes desde el extranjero."
    en: "Julien founded the Belgian association [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"} and has known the Shuar since 2017. He accompanies the tours as guide and translator and is your contact if you are coming from abroad."
    fr: "Julien a fondé l’association belge [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"} et connaît les Shuar depuis 2017. Il accompagne les tours comme guide et traducteur et est votre contact si vous venez de l’étranger."

