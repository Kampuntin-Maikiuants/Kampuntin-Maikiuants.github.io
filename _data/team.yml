# Personen auf der Seite „Equipo / People“
# Texte dürfen **fett**, *kursiv* und [Links](https://...) enthalten.
# group: kampuntin (Organisationsteam) oder community. "details" (optional) ist die ausführliche Beschreibung und ersetzt auf der Seite die kurze "bio".
# photo: optional, z. B. /assets/img/equipo/nombre.jpg (quadratisch, ca. 600×600 px)
# shuar_name: optional, Shuar-Name unter dem Namen.
# social: optional, Links zu Instagram/Facebook der Person (name, handle optional, url).
# Keine Telefonnummern oder E-Mails hier. contact: true zeigt den Link zur Kontaktseite (nur bei den Ansprechpersonen).
# WICHTIG: Nur mit Einverständnis der Person veröffentlichen.

- name: "Freddy Ankuash"
  contact: true
  shuar_name: "Nenkas Chicham"
  group: kampuntin
  photo: "/assets/img/equipo/freddy.jpg"
  social:
    - { name: Instagram, url: "https://www.instagram.com/nekas_chicham/" }
  role: { es: "Gerente y coordinación de Kampuntin", en: "Manager and coordinator of Kampuntin", fr: "Gérant et coordinateur de Kampuntin" }
  bio:
    es: "Coordina a los voluntarios y a los grupos, y planifica las excursiones."
    en: "Coordinates the volunteers and groups and plans the excursions."
    fr: "Coordonne les bénévoles et les groupes et organise les excursions."
  details:
    es: "Freddy coordina a los voluntarios y a los grupos. También participa en las excursiones y las planifica."
    en: "Freddy coordinates the volunteers and groups. He also takes part in the excursions and plans them."
    fr: "Freddy coordonne les bénévoles et les groupes. Il participe aussi aux excursions et les organise."

- name: "Julien Shakaim"
  contact: true
  group: kampuntin
  photo: "/assets/img/equipo/julien.jpg"
  role: { es: "Fundador de Raíces · guía y traductor", en: "Founder of Raíces · guide and translator", fr: "Fondateur de Raíces · guide et traducteur" }
  bio:
    es: "Fundó la asociación belga Raíces y acompaña los tours como guía y traductor."
    en: "Founded the Belgian association Raíces and accompanies the tours as guide and translator."
    fr: "A fondé l’association belge Raíces et accompagne les tours comme guide et traducteur."
  details:
    es: "Julien es aventurero, realizador y fotógrafo, y fundó la asociación belga [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"}. Conoció a los shuar en 2017, durante un viaje de cuatro años sin motor por el continente americano, y desde entonces considera a Maikiuants su familia amazónica. Acompaña los tours como guía y traductor y es tu contacto si vienes desde el extranjero."
    en: "Julien is an adventurer, filmmaker and photographer and founded the Belgian association [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"}. He met the Shuar in 2017 during a four-year journey across the Americas without a motor, and has since considered Maikiuants his Amazonian family. He accompanies the tours as guide and translator and is your contact if you are coming from abroad."
    fr: "Julien est aventurier, réalisateur et photographe, et a fondé l’association belge [Raíces](https://www.raices.be/){:target=\"_blank\" rel=\"noopener\"}. Il a rencontré les Shuar en 2017, lors d’un voyage de quatre ans sans moteur à travers le continent américain, et considère depuis Maikiuants comme sa famille amazonienne. Il accompagne les tours comme guide et traducteur et est votre contact si vous venez de l’étranger."

- name: "Marcos Ankuash"
  group: kampuntin
  photo: "/assets/img/equipo/marcos.jpg"
  role: { es: "Tesorero de Kampuntin", en: "Treasurer of Kampuntin", fr: "Trésorier de Kampuntin" }
  bio:
    es: "Emprendedor comercial con su tienda de víveres y gestor digital."
    en: "A business entrepreneur with his grocery shop and a digital manager."
    fr: "Entrepreneur commercial avec son épicerie et gestionnaire numérique."
  details:
    es: "Marcos es emprendedor comercial con su tienda de víveres. También es gestor digital y administra la cuenta de Instagram [«Territorio Shuar Indomable»](https://www.instagram.com/territorioshuar/){:target=\"_blank\" rel=\"noopener\"}."
    en: "Marcos is a business entrepreneur with his grocery shop. He is also a digital manager and runs the Instagram account [\"Territorio Shuar Indomable\"](https://www.instagram.com/territorioshuar/){:target=\"_blank\" rel=\"noopener\"}."
    fr: "Marcos est entrepreneur commercial avec son épicerie. Il est aussi gestionnaire numérique et administre le compte Instagram [« Territorio Shuar Indomable »](https://www.instagram.com/territorioshuar/){:target=\"_blank\" rel=\"noopener\"}."

- name: "Eddy Ankuash"
  group: kampuntin
  photo: ""
  role: { es: "Secretario de Kampuntin", en: "Secretary of Kampuntin", fr: "Secrétaire de Kampuntin" }
  bio:
    es: "Es emprendedor en la agricultura y la carpintería."
    en: "An entrepreneur in agriculture and carpentry."
    fr: "Entrepreneur dans l’agriculture et la menuiserie."
  details:
    es: "Eddy es emprendedor en la agricultura y la carpintería. Cultiva plátano, yuca y caña de azúcar, y los visitantes y los voluntarios pueden cosechar junto con él."
    en: "Eddy is an entrepreneur in agriculture and carpentry. He grows bananas, cassava and sugarcane, and visitors and volunteers can harvest together with him."
    fr: "Eddy est entrepreneur dans l’agriculture et la menuiserie. Il cultive bananes, manioc et canne à sucre, et les visiteurs et les bénévoles peuvent récolter avec lui."

- name: "Jessica"
  group: kampuntin
  photo: "/assets/img/equipo/jessica.jpg"
  role: { es: "Voluntaria y parte de la comunidad", en: "Volunteer and community member", fr: "Bénévole et membre de la communauté" }
  bio:
    es: "Vive con los grupos de voluntarios y ayuda en los tours."
    en: "Lives together with the volunteer groups and helps with the tours."
    fr: "Vit avec les groupes de bénévoles et aide lors des tours."
  details:
    es: "Jessica también es voluntaria. Vive con los grupos de voluntarios, ayuda en los tours y acerca la cultura de la comunidad a los visitantes y a los voluntarios."
    en: "Jessica is also a volunteer. She lives together with the volunteer groups, helps with the tours and brings the local culture closer to visitors and volunteers."
    fr: "Jessica est aussi bénévole. Elle vit avec les groupes de bénévoles, aide lors des tours et rapproche la culture locale des visiteurs et des bénévoles."

- name: "Numi"
  group: kampuntin
  photo: "/assets/img/equipo/numi.jpg"
  social:
