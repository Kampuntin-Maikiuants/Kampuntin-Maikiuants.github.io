animals:
  title: Los animales con quienes convivimos
  intro: >-
    La selva y los ríos de Maikiuants son el hogar de muchísimos animales. Algunos están
    amenazados, otros son nuevos para la ciencia y muchos viven escondidos bajo el agua.

  threatened:
    title: Especies amenazadas
    intro: >-
      Maikiuants es un área de gran importancia para la biodiversidad. La relación armoniosa de la
      comunidad shuar con la naturaleza permite que en su territorio convivan mamíferos en peligro
      de extinción a nivel mundial. Las cámaras trampa de 2024 registraron, entre otros:
    note: Categorías de amenaza según nuestro panel informativo.
    also: "También registrados: margay, tayra, ocelote, ardilla amazónica y falso vampiro, entre otros."

  atelopus:
    title: "Una rana muy especial: Atelopus sp."
    name: Atelopus sp.
    images:
      - { image: /assets/img/fotos/atelopus.jpg, alt: Rana Atelopus amarilla y negra sobre musgo }
      - { image: /assets/img/fotos/atelopus-2.jpg, alt: Rana Atelopus vista desde abajo, en la mano de un guía }
    text: |-
      Todas las especies del género *Atelopus* están amenazadas. La rana *Atelopus sp.* está en
      peligro de extinción, sobre todo por la pérdida de su hábitat natural. Maikiuants es uno de
      los pocos lugares del mundo donde todavía se la puede ver.

      Su supervivencia depende de un ecosistema equilibrado, con bosques sanos y agua limpia. Es
      tan sensible a los cambios de su entorno y tan difícil de encontrar que todavía está en
      proceso de descripción científica.

  frog:
    title: ¿Una especie nueva para la ciencia?
    name: Rhinella maikiuants (nombre propuesto)
    images:
      - { image: /assets/img/fotos/rana-nueva.jpg, alt: La rana de Maikiuants que podría ser una especie nueva }
      - { image: /assets/img/fotos/rana-nueva-2.jpg, alt: La rana en una bolsa de muestreo durante el monitoreo }
      - { image: /assets/img/fotos/rana-nueva-3.jpg, alt: La rana sobre una piedra, fotografiada durante el monitoreo }
    text: |-
      El **19 de junio de 2024**, durante el monitoreo, los paraecólogos encontraron una rana de la
      familia de los sapos (*Bufonidae*) con características muy inusuales. Todo indica que se trata
      de una **especie nueva para la ciencia** que solo existe en el territorio de Maikiuants. Por
      eso proponemos para ella el nombre científico ***Rhinella maikiuants***.

      En la investigación participan unos diez paraecólogos de Maikiuants, con el apoyo de la
      Universidad del Azuay (UDA) y en colaboración con Ecoforensic, una empresa de Gran Bretaña
      que también revisa los resultados. Ahora la
      comunidad científica está debatiendo el hallazgo; esperamos que pronto se confirme
      oficialmente como especie nueva.

  river:
    title: "Vida bajo el agua: los animales de nuestros ríos"
    image: /assets/img/libro/collage.jpg
    image_alt: Macroinvertebrados acuáticos de nuestros ríos (fotos del libro)
    text: |-
      El agua de los ríos Yunkumas y Akaas está en excelentes condiciones, gracias a que el bosque
      está intacto – medimos un pH de 7,8. En los ríos viven pequeños animales acuáticos (larvas
      de insectos, caracoles, cangrejos y camarones) que casi nadie ve. Los paraecólogos los
      recolectan, los identifican y los fotografían.

      Como reaccionan rápido a la contaminación, nos permiten entender la calidad del agua y
      detectar enseguida cualquier alteración – por ejemplo en ríos cercanos afectados por la
      actividad minera.
    book_note: >-
      Fotografías: *Guía de macroinvertebrados acuáticos de las microcuencas de los ríos Aakas y
      Yunkumas – Cordillera del Cóndor*. La guía completa describe muchas más familias, su anatomía
      y su función como indicadores de la calidad del agua.
    book_link: Ver la publicación
    groups:          # Fotos aus dem Buch
      - { name: "Efímera", latin: Euthyplociidae, image: /assets/img/libro/euthyplociidae.jpg }
      - { name: "Caballito del diablo (larva)", latin: Polythoridae, image: /assets/img/libro/polythoridae.jpg }
      - { name: "Escarabajo centavo", latin: Psephenidae, image: /assets/img/libro/psephenidae.jpg }
      - { name: "Escarabajo de los rápidos (larva)", latin: Elmidae, image: /assets/img/libro/elmidae.jpg }
      - { name: "Escarabajo dríopido", latin: Dryopidae, image: /assets/img/libro/dryopidae.jpg }
      - { name: "Escarabajo estafilínido", latin: Staphylinidae, image: /assets/img/libro/staphylinidae.jpg }
      - { name: "Mosca de alas reticuladas (larva)", latin: Blephariceridae, image: /assets/img/libro/blephariceridae.jpg }
      - { name: "Mosca negra (larva)", latin: Simuliidae, image: /assets/img/libro/simuliidae.jpg }
      - { name: "Sanguijuela", latin: Glossiphoniidae, image: /assets/img/libro/glossiphoniidae.jpg }
