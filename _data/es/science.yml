# Buch: Titel vom Cover. Restliche Angaben in [eckigen Klammern] bitte ergänzen.
book:
  eyebrow: Nuestro libro
  title: Guía de macroinvertebrados acuáticos
  subtitle: de las microcuencas de los ríos Aakas y Yunkumas – Cordillera del Cóndor
  cover: "/assets/img/libro/portada-recortada.jpg"
  cover_alt: Portada de la Guía de macroinvertebrados acuáticos de los ríos Aakas y Yunkumas
  text: >-
    La comunidad shuar Maikiuants, asentada en la Cordillera del Cóndor, presenta un amplio territorio que alberga una gran biodiversidad de especies y ecosistemas, hoy amenazados por actividades extractivas. Esta zona es bañada principalmente por los ríos Aakas y Yunkumas, cuyos ecosistemas acuáticos presentan una amplia variedad de fauna, entre la que destacan los macroinvertebrados acuáticos. Esta guía presenta las familias de este grupo de fauna, que por su presencia demuestran que las aguas de estos dos ríos están en excelentes condiciones. Esta obra es el resultado de estudios que se realizan de manera conjunta entre la Universidad del Azuay, la comunidad de Maikiuants, el Pueblo Shuar Arutam y la Fundación Ecoforensic, cuyo objetivo es explorar y evidenciar la riqueza biológica y cultural de estos.
  details:
    - { label: Idioma, value: "Español" }
    - { label: Editorial, value: "Universidad del Azuay & Casa Editorial" }
    - { label: ISBN, value: "978-9942-54-103-1" }
  button: { label: Preguntar por el libro, url: "" }   # leer = Kontaktseite
  pages_title: Un vistazo al libro
  pages:
    - { image: /assets/img/libro/anatomia.jpg, alt: "Página del libro: anatomía de los macroinvertebrados" }
    - { image: /assets/img/libro/paginas.jpg, alt: "Doble página con una sanguijuela (Glossiphoniidae)" }
