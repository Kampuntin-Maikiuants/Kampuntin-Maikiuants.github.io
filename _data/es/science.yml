# Página de ciencia (paraecología) – español

hero:
  eyebrow: Ciencia
  title: "Paraecología: investigar el bosque desde la comunidad"
  lead: >-
    En Maikiuants, personas de la comunidad se forman como paraecólogas y paraecólogos.
    Unen el conocimiento shuar del bosque con métodos científicos para documentar la
    biodiversidad y proteger su territorio.
  image: "/assets/img/fotos/hero-ciencia.jpg"
  image_alt: Paraecólogos de Maikiuants trabajando con microscopios

what:
  title: ¿Qué es un paraecólogo?
  image: "/assets/img/fotos/paraecologos.jpg"
  image_alt: El equipo de paraecólogos junto al río
  text: |-
    Un paraecólogo o una paraecóloga es una persona de la comunidad capacitada en métodos de
    monitoreo ecológico. Conoce el bosque y sus particularidades desde la infancia, y aprende a
    registrar sus observaciones de forma sistemática, para que puedan compararse a lo largo de
    los años y compartirse con investigadores.

    Así, el conocimiento se queda en la comunidad y los datos sirven para tomar decisiones sobre
    el territorio: dónde construir nuevas casas, qué zonas proteger y cómo cambian el río y el
    bosque con el cambio climático. El objetivo es defender el territorio, no solo el bosque.
  quote:
    text: >-
      Somos personas que damos auxilio a toda la biodiversidad que existe en nuestro territorio,
      para conocerla, valorarla y respetarla, y llamamos a la conciencia ambiental para que las
      próximas generaciones la sigan cuidando. Ser paraecólogo es dar auxilio a todas las especies
      que están en peligro de extinción.
    author: Freddy Ankuash, paraecólogo, gerente y coordinador de Kampuntin

methods:
  title: Qué monitoreamos
  intro: >-
    Además de la estación
    meteorológica y las cámaras trampa que ya funcionan, pronto se construirá una nueva estación
    científica para recoger y analizar los datos de forma aún más sistemática.
  items:
    - title: Cámaras trampa
      text: >-
        Hemos instalado cámaras automáticas en el territorio de los animales amenazados para
        observar su comportamiento, sus patrones de actividad y, si es posible, su reproducción.
    - title: Recorridos de exploración
      text: >-
        En cada recorrido revisamos todo a la vez: cantos de aves, anfibios, mamíferos y otros indicadores del
        bosque, árboles semilleros, floración y fructificación – en conexión con el vivero y la
        agroforestería.
    - title: Calidad del agua
      text: >-
        Medimos regularmente los ríos y quebradas: valor de pH, temperatura, turbidez y
        macroinvertebrados acuáticos, que reaccionan muy rápido a cualquier contaminación.
    - title: Estación meteorológica
      text: >-
        Nuestra estación meteorológica registra temperatura, humedad del aire, lluvia y viento.
        Así documentamos cómo cambia el clima en el territorio.
    - title: Vida shuar
      text: >-
        Documentamos la vida y los saberes shuar: tomamos fotos, grabamos la lengua shuar chicham
        y registramos nombres, usos y relatos sobre plantas y animales.
    - title: Nueva estación científica
      text: >-
        Próximamente: una estación propia para guardar, procesar y analizar los datos del
        monitoreo directamente en Maikiuants.

