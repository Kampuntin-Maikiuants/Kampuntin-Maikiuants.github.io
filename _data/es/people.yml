# Página del equipo – español (las personas están en _data/team.yml)
hero:
  eyebrow: Equipo
  title: "Las personas detrás de Kampuntin"
  lead: >-
    Detrás de Kampuntin hay un pequeño equipo: personas que coordinan los tours y el voluntariado,
    te guían por la selva y te acompañan durante tu estancia.
  image: "/assets/img/ilustraciones/detalle-3.jpg"
  image_alt: Ilustración de plantas de la selva amazónica
groups:
  community: De la comunidad
  kampuntin: "Kampuntin: tu equipo en Maikiuants"

# Letzte Karte im Team: alle weiteren Menschen aus der Gemeinschaft
more_people:
  image: /assets/img/equipo/comunidad.jpg
  title: Y muchas personas más
  role: De la comunidad de Maikiuants
  text: >-
    Además del equipo, muchas personas de la comunidad ayudan: guías, cocineras, artesanas y
    familias. Las conocerás en Maikiuants y estarás en contacto con ellas durante tu estancia.

