hero:
  eyebrow: Amazonía ecuatoriana · Morona Santiago
  title: Kampuntin Maikiuants
  lead: >-
    Vive la selva y conoce a la comunidad shuar de Maikiuants: en uno de nuestros dos viajes o
    como voluntaria o voluntario. Descubre la comunidad, la selva, nuestro trabajo científico y la
    misión de Kampuntin.
  image: "/assets/img/ilustraciones/banner-startseite.jpg"
  image_alt: Ilustración de plantas de la selva amazónica
  buttons:
    - { ref: tours, label: Conocer los tours }
    - { ref: volunteering, label: Ser voluntario/a, style: ghost }

about:
  title: "Quiénes somos"
  items:
    - title: "Los shuar"
      image: "/assets/img/fotos/shuar.jpg"
      image_alt: "Familias shuar de Maikiuants en el bosque"
      text: >-
        Los shuar son un pueblo milenario, uno de los más numerosos de la Amazonía, cuyo objetivo es proteger el territorio. Su idioma es el **shuar chicham**. Su vida está profundamente ligada al bosque, a los ríos y a la espiritualidad.
    - title: Maikiuants
      image: "/assets/img/fotos/maikiuants.jpg"
      image_position: bottom
      image_alt: "El centro de la comunidad de Maikiuants rodeado de selva"
      text: >-
        Maikiuants es una comunidad shuar de la provincia de Morona Santiago, en la Amazonía sur de Ecuador, y forma parte del **Pueblo Shuar Arutam**. El pueblo toma su nombre del río que lo atraviesa: *maikiua* es el guanto (floripondio), que crece a lo largo de sus orillas, y *ants* es el agua. Maikiuants significa «el agua del guanto».
    - title: Kampuntin
      image: "/assets/img/fotos/kampuntin.jpg"
      image_alt: "El equipo de Kampuntin con un grupo de voluntarios frente a la jea"
      text: >-
        *Kampuntin* significa «selva» en shuar chicham, de ahí nuestro lema **«Selva, mi destino»**. Nacimos desde dentro de la comunidad de Maikiuants. Queremos crear un intercambio cultural, compartiendo una mirada sobre el bosque y la comunidad desde dentro, y al mismo tiempo apoyar económicamente a la comunidad de Maikiuants. Kampuntin es también la organización detrás del trabajo científico, del monitoreo y de la protección de la selva.


# PLATZHALTER – die Mission wird noch genauer ausformuliert
mission:
  title: La misión de Kampuntin
  intro: |-
    La Organización Comunitaria de Servicios Turísticos KAMPUNTIN, Selva Mi Destino, tiene como objetivo preservar la cultura, las costumbres y la sabiduría ancestral del pueblo Shuar, promoviendo un intercambio cultural basado en el respeto, la identidad y la naturaleza.

    Nuestros principios se fundamentan en la protección de la Amazonía, la conservación de la selva, la transmisión de conocimientos a las nuevas generaciones y al mundo, y el fortalecimiento de una economía sostenible y sustentable que beneficie a las familias de la comunidad Maikiuants.

    En Kampuntin, no se trata solamente de turismo, sino de compartir nuestra identidad, defender nuestro territorio y construir un futuro con dignidad, cultura y armonía con la naturaleza.

    **KAMPUNTIN – SELVA MI DESTINO**<br>Desarrollo económico con identidad, respeto a la naturaleza y orgullo de ser Shuar.
  items:
    - title: Cuidar y monitorear la selva
      text: >-
        Cuidamos y monitoreamos el bosque, los ríos y los animales de nuestro territorio, para que
        también las próximas generaciones puedan vivir de ellos y con ellos.
    - title: Compartir y documentar la cultura shuar
      text: >-
        Transmitimos nuestra lengua, nuestros saberes y costumbres a los visitantes y a las próximas generaciones.
    - title: Aprender juntos
      text: >-
        Visitantes, voluntarios y comunidad aprenden unos de otros: sobre plantas, comida, espiritualidad y otras formas de vivir.
    - title: Fortalecer la comunidad
      text: >-
        Pagamos a guías y cocineras locales, compramos los alimentos dentro de la comunidad y apoyamos económicamente a Maikiuants.
quote:
  text: Iikia kampuntniuitji tura achitkiaji ii nekatairijiai.
  translation: "Somos naturaleza, conexión y sabiduría."
  source: ""


# Proyecto: casa cultural y científica (imágenes: visualizaciones de la Universidad del Azuay)
culture_house:
  eyebrow: Proyecto
  title: Casa cultural y científica
  text: >-
    En Maikiuants se construirá una casa cultural y científica: un lugar donde se muestran y se
    conservan tanto la ciencia como la cultura shuar. Se construirá por etapas e incluirá un
    museo, laboratorios, un centro educativo, oficinas, dormitorios y alojamiento para
    científicos, un comedor con cocina y baños secos.
  note: "Visualizaciones del proyecto: Universidad del Azuay – Consultora de Arquitectura y Urbanismo."
  images:
    - { image: /assets/img/casa-cultural/casa-cultural-1.jpg, alt: "Visualización: vista aérea de los laboratorios, el alojamiento para científicos y la casa redonda con techo de paja" }
    - { image: /assets/img/casa-cultural/casa-cultural-3.jpg, alt: "Visualización: la plaza central con el museo, las oficinas y el centro educativo" }
    - { image: /assets/img/casa-cultural/casa-cultural-2.jpg, alt: "Visualización: dormitorios, comedor con cocina y baño seco en medio de la selva" }
    - { image: /assets/img/casa-cultural/casa-cultural-4.jpg, alt: "Visualización: visitantes y miembros de la comunidad frente a los edificios de madera" }
    - { image: /assets/img/casa-cultural/casa-cultural-5.jpg, alt: "Visualización: camino entre los edificios de madera y la casa redonda" }

location:
  title: Dónde estamos
  text: >-
    Maikiuants se encuentra en la provincia de **Morona Santiago**, en la Amazonía sur del
    Ecuador, en la Cordillera del Cóndor. La carretera hacia Maikiuants sale de **Limón Indanza**;
    desde allí se llega en unas dos horas y media, normalmente en taxi (aprox. 60–70 USD).
    Los tours empiezan en Cuenca y desde allí viajamos juntos hasta la comunidad.
    La carretera no aparece en Google Maps, pero sí en OpenStreetMap.
  coords: 3°07'10.2" S · 78°15'56.4" O
  map_link: Ver en OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"
  labels:
    title: Mapa del Ecuador con la ubicación de Maikiuants en la Amazonía sur
    peru: Perú
    ocean: Océano Pacífico
  region:
    title: "Mapa detallado: el camino de Limón Indanza a Maikiuants"

explore:
  title: Descubre Maikiuants
  intro: Elige por dónde empezar.
  items:
    - ref: tours
      title: Tours
      text: "Dos viajes para grupos de hasta 12 personas: el viaje espiritual de 11 días y el viaje Arutam de 22 días."
    - ref: volunteering
      title: Voluntariado
      text: Huerta, agroforestería, mingas y construcción, viviendo en una jea tradicional en medio del bosque.
    - ref: science
      title: Ciencia
      text: Paraecólogas y paraecólogos de la comunidad monitorean la biodiversidad, los ríos y el clima.

