# Aviso legal y privacidad – español
# MARCADOR: el contenido debe ser revisado por una persona experta en derecho.
title: Aviso legal y privacidad
sections:
  - title: Responsable
    text: |-
      Organización Comunitaria de Servicios Turísticos Kampuntin (Selva mi destino)
      Oficina: comunidad de Maikiuants
      Limón Indanza, Morona Santiago, Ecuador
      Correo: ocstkampuntin@gmail.com
  - title: Mantenimiento de la web
    text: >-
      Esta web la mantiene Jesko Dorner. Para preguntas o correcciones sobre su contenido: jesko.dorner@gmail.com. Para tours, voluntariado y todo lo demás, escribe a Kampuntin (ver arriba).
  - title: Alojamiento web
    text: >-
      Este sitio está alojado en GitHub Pages (GitHub Inc., EE. UU.). Al visitarlo, GitHub
      procesa datos técnicos como tu dirección IP para entregar las páginas y garantizar la
      seguridad. Más información en la declaración de privacidad de GitHub.
  - title: Cookies y servicios externos
    text: >-
      Este sitio no usa cookies. Los contenidos de YouTube, Instagram
      y Facebook solo se cargan cuando haces clic en ellos; a partir de ese momento se
      transmiten datos a esas plataformas.
  - title: Contacto
    text: >-
      Los datos que nos envías por correo o por WhatsApp se usan únicamente para responder a tu
      consulta y no se comparten con terceros.
  - title: Tus derechos
    text: >-
      Puedes solicitar en cualquier momento información sobre tus datos, su corrección o su
      eliminación escribiendo a jesko.dorner@gmail.com (quien mantiene esta web) o a
      ocstkampuntin@gmail.com.
# Erscheint nur, wenn in _config.yml "goatcounter" eingetragen ist
analytics:
  title: Estadísticas de visitas
  text: >-
    Para saber cuántas personas visitan la web usamos GoatCounter. No usa cookies ni guarda datos personales: solo cuenta visitas de forma anónima (página, país aproximado, tipo de navegador).
