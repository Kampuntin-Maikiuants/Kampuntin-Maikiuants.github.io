# Página de voluntariado – español (basada en el perfil de WWOOF)
# Los datos entre [corchetes] son marcadores: reemplazar por la información real.

hero:
  eyebrow: Voluntariado
  title: Voluntariado en Maikiuants
  lead: >-
    Únete a nosotros en Maikiuants para trabajar, aprender y vivir juntos.
  image: "/assets/img/fotos/hero-voluntariado.jpg"
  image_alt: Voluntarias con machetes junto a un miembro de la comunidad

who:
  title: "Buscamos a personas que quieran…"
  items:
    - aprender sobre plantas, agroforestería y permacultura
    - vivir en grupo y compartir las tareas
    - conocer la cultura shuar y la vida en la selva
    - pasar mucho tiempo al aire libre
    - vivir un día a día lento, tranquilo y flexible
    - ser una persona abierta, respetuosa y flexible


tasks:
  title: "En qué ayudas"
  intro: >-
    Te invitamos a ayudar donde haga falta y a aportar tus propias ideas y habilidades. Algunas de las tareas en las que puedes ayudar:
  items:
    - title: "Huerta y jardín"
      text: "Vivero, siembra y cuidado del jardín y del terreno alrededor de la casa."
    - title: "Agroforestería"
      text: "Mantener los cultivos agroforestales con deshierbe, poda y cosecha."
    - title: "Construcción"
      text: "Apoyar en trabajos de construcción y en mejoras de la infraestructura."
    - title: "Mingas"
      text: "Jornadas de trabajo comunitario en el pueblo de Maikiuants."
    - title: "Tus habilidades"
      text: "Aporta tus propias habilidades, por ejemplo costura, redes sociales o videos. También puedes ayudar con tu idioma, con traducciones o enseñando idiomas. Cualquier impulso es bienvenido."


life:
  title: La vida en la jea
  text: |-
    Dormimos en una casa tradicional llamada **jea**, en medio de la selva. Hay literas de tres
    niveles y la posibilidad de colgar una hamaca. La ducha es la mejor del mundo: un río puro
    de agua fresca.

    Hay una cocina bien equipada. Un panel solar le da electricidad, y hay licuadora y extractor
    de jugos. En el futuro queremos instalar una pequeña refrigeradora para guardar alimentos.
    Normalmente las comidas se comparten con los demás voluntarios.
  # Die 6 Fotos stehen in _data/jea_photos.yml (gemeinsam mit der Tour-Seite)

free_time:
  title: Tiempo libre
  text: >-
    En tu tiempo libre puedes aprovechar la zona: te llevamos a caminatas preciosas, puedes jugar
    con los niños, participar en la elaboración de cerámica, hacer artesanías, tocar música y
    cantar. También puedes aprovechar tu tiempo libre para aprender, leer y meditar.
  quote: Es un lugar de creatividad y libertad donde todo es posible.

practical:
  title: Datos prácticos
  items:
    - { label: Estancia, value: "Mínimo un mes (estancias más cortas, de 2–3 semanas, se pueden acordar) – sin límite" }
    - { label: Horario de trabajo, value: "Flexible, 3–5 horas al día, 5 días por semana" }
    - label: Comida
      value: >-
        Trae comida al menos para la primera semana, para cocinar junto con las 2–3 personas de la
        comunidad con quienes vives. Aquí hay muchos plátanos y guineos, y una pequeña tienda en la
        comunidad vende productos básicos. Trae también dinero extra para compras y el taxi desde
        Limón Indanza que te traerá la comida. Para todo hay solución y la gente está siempre dispuesta a ayudar.
    - { label: Idiomas, value: "Español y shuar chicham, otros idiomas casi no. Un nivel básico de español ayuda mucho" }
    - { label: Llegada, value: "En bus hasta Limón Indanza y desde allí unas 2 h 30 en taxi (aprox. 60–70 USD) hasta la comunidad" }
  wwoof: También nos encuentras en WWOOF

apply:
  title: Cómo postular
  steps:
    - title: Preséntate
      text: Escríbenos quién eres, qué te motiva y en qué fechas te gustaría venir.
    - title: Confirmación
      text: Acordamos las fechas y los demás detalles.
    - title: ¡Bienvenida/o!
      text: Te recibimos en el alojamiento y te mostramos todo.
  button: Quiero ser voluntario/a

# Erfahrungsberichte (nur mit Einverständnis der Personen veröffentlichen)
testimonials:
  title: Experiencias de voluntarios
  intro: Lo que cuentan quienes ya vivieron un tiempo en Maikiuants.
  # quote = kurzes Zitat (immer sichtbar) · text = ganzer Bericht zum Aufklappen (optional, beliebig lang)
  items:
    - quote: >-
        Lo que más disfruté fue que no todo seguía un horario fijo: el día podía desarrollarse de forma natural.
      name: "Yael"
      meta: "Voluntariado · octubre de 2026"
      photo: ""
      text: |-
        Mi tiempo en Maikiuants estuvo marcado por el ritmo de vida lento y tranquilo. Lo que más disfruté fue que no todo seguía un horario fijo. Cada día podía desarrollarse de forma natural, según cómo se sentía la gente, el clima y las tareas que había que hacer.

        Después de pocos días, la caminata de 30 minutos hasta la comunidad ya no me molestaba, y a menudo nos llevaban en moto, lo que hacía el camino aún más divertido. La gente de la comunidad fue increíblemente acogedora, abierta y servicial. Me mostraron muchísimas cosas maravillosas e interesantes, y aprendí mucho.

        Nos dieron mucha yuca, plátanos y guineos, y pudimos ayudar a cosecharlos. Dos personas de la comunidad pasaban los días con nosotros y poco a poco nos mostraron todo: la selva, la comunidad y las comunidades vecinas. Muy pronto nos sentimos como en casa.

        También tuve mucha libertad en el trabajo. Podía elegir en gran parte qué quería hacer y organizar mis tareas con flexibilidad, así que el trabajo se sentía menos como una obligación y más como un pasatiempo que de verdad disfrutaba.

        Mi tiempo en la comunidad y en la jea fue muy valioso para mí. Viví muchas experiencias nuevas, conocí a gente interesante y aprendí cosas que me acompañarán mucho después de haberme ido.
    - quote: >-
        Si estás abierto a condiciones de vida simples y naturales, al intercambio cultural y te gusta lo inesperado, sin duda vas a tener una buena experiencia.
      name: "Lotte"
      meta: "Voluntariado · Alemania · agosto de 2025"
      photo: ""
      text: |-
        Hace unos meses pasamos un mes con los shuar. Fue un tiempo que recuerdo con mucho cariño y una experiencia que fue valiosa. A 20 minutos a pie del pueblo donde viven los shuar, dormimos en una casa tradicional cerca del río, rodeados de una naturaleza hermosa y fascinante, entre los sonidos maravillosos de la selva.

        Todas las mañanas caminamos al pueblo para ayudar en el proyecto de agroforestería. Aprendimos mucho sobre las plantas y cómo plantarlas, sobre las relaciones ecológicas y los retos locales. Las rutinas diarias eran relajadas y a veces fuimos selva adentro, a las cascadas, para aprender sobre las tradiciones y hacernos una idea de los amplios conocimientos de los shuar sobre la selva. Creo que lo que hacen los voluntarios allí es probablemente siempre diferente y puede ser algo distinto de lo que hicimos. Pero, de todas formas, recomendamos que se queden allí al menos 3 semanas para establecer una conexión con la familia, los niños y las otras personas. Todo se toma su tiempo…

        Muchas experiencias fantásticas han quedado sin mencionar aquí, pero si estás abierto a condiciones de vida simples y naturales, al intercambio cultural y te gusta lo inesperado, sin duda vas a tener una buena experiencia.

        ¡Saludos a Nancy y Pinchu, Estrella, Kilian y Kirup, a Freddy, Numi y Julien!

        Dino y Lotz

faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto cuesta el voluntariado?
      a: >-
        El alojamiento en la jea es a cambio de tu trabajo. Trae dinero para el taxi desde Limón
        Indanza y para comprar tu comida (ver «Datos prácticos»).
    - q: ¿Necesito experiencia en agricultura o construcción?
      a: >-
        No. Lo importante son las ganas de aprender y de trabajar. Te enseñamos todo lo
        necesario en el lugar.
    - q: ¿Necesito hablar español?
      a: >-
        En la comunidad casi nadie habla inglés, así que un nivel básico de español ayuda mucho para convivir.
    - q: ¿Cómo es un día normal?
      a: >-
        Cada día es diferente. Muchas veces no hay un plan fijo y muchas cosas surgen de forma
        espontánea. Puedes traer tus propios deseos e ideas, y juntos vemos qué se puede hacer.
    - q: ¿Hay internet y electricidad?
      a: >-
        La cocina funciona con energía solar y ahí puedes cargar tu teléfono. En la casa donde vives
        no hay wifi ni señal de teléfono, pero en el pueblo, a unos 35 minutos a pie, puedes usar wifi
        gratis.
    - q: ¿Qué vacunas y seguro necesito?
      a: >-
        Un seguro de viaje con cobertura médica es obligatorio. Consulta a un médico de viajes; para
        la Amazonía suelen ser muy importantes las vacunas contra la fiebre amarilla, la fiebre
        tifoidea, la hepatitis A y B y la rabia.
    - q: ¿Puedo venir con mi pareja, mi familia o con amigos?
      a: >-
        Sí, escríbenos con tiempo. El albergue tiene lugar para 12 personas.
