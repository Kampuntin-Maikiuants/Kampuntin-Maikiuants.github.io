faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tiempo puedo quedarme?
      a: >-
        Lo ideal es un mínimo de un mes, pero somos flexibles: también se pueden acordar dos o tres
        semanas. No hay máximo: puedes quedarte meses o incluso años; un amigo nuestro ya vive aquí
        desde hace cinco años.
    - q: ¿Cuánto cuesta el voluntariado?
      a: >-
        El alojamiento en la jea es a cambio de tu trabajo. La comida la traes tú y la cocinan
        juntos (ver «Datos prácticos»); calcula además dinero para compras pequeñas y el taxi desde
        Limón Indanza.
    - q: ¿Necesito experiencia en agricultura o construcción?
      a: >-
        No. Lo importante son las ganas de aprender y de trabajar. Te enseñamos todo lo
        necesario en el lugar.
    - q: ¿Necesito hablar español?
      a: >-
        Aquí se habla español y shuar chicham; otros idiomas casi no. Un nivel básico de español
        ayuda mucho para convivir con la comunidad, pero siempre encontramos una manera de
        entendernos.
    - q: ¿Cómo es un día normal?
      a: >-
        Por la mañana, cuando hace más fresco, trabajamos en el vivero, en las parcelas o en
        la construcción. Después del almuerzo compartido, la tarde suele ser libre: río,
        caminatas, artesanía o tiempo con los niños.
    - q: ¿Hay internet y electricidad?
      a: >-
        Un panel solar da electricidad a la cocina y ahí también puedes cargar tu teléfono. No hay
        señal de teléfono, pero hay internet en el centro comunitario, a unos 20–25 minutos a pie.
    - q: ¿Qué vacunas y seguro necesito?
      a: >-
        Un seguro de viaje con cobertura médica es obligatorio. Consulta a un médico de viajes;
        para la Amazonía normalmente se recomienda la vacuna contra la fiebre amarilla.
    - q: ¿Puedo venir con mi pareja o con amigos?
      a: >-
        Sí, escríbenos con tiempo. En el albergue hay lugar para 12 personas; ya hemos recibido a
        6 o 7 voluntarios a la vez.
