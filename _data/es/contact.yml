location:
  title: Dónde estamos
  text: >-
    Maikiuants está en la provincia de Morona Santiago, en la Amazonía sur del Ecuador. La
    carretera hacia la comunidad sale de Limón Indanza; desde allí son unas dos horas y media,
    normalmente en taxi 4×4 (aprox. 50–60 USD). A los grupos de los tours los recogemos en Quito.
    Los demás detalles del viaje los acordamos antes de tu llegada.
  map_link: Ver en OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"

faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tardan en responder?
      a: >-
        Normalmente pocos días. En la selva la señal es limitada, así que a veces tardamos un poco
        más. Por WhatsApp suele ser más rápido.
    - q: ¿En qué idiomas puedo escribir?
      a: En español o en inglés. [Indicar otros idiomas si los hay.]
    - q: ¿Cómo llego a Maikiuants?
      a: >-
        **Tours:** te recogemos en Quito. Nuestro guía internacional viaja con el grupo en buseta
        hasta Cuenca y desde allí en taxi hasta Maikiuants; el transporte está incluido en el precio.
        **Voluntariado:** en bus hasta Limón Indanza y desde allí unas dos horas y media en taxi 4×4
        (aprox. 50–60 USD) hasta la comunidad. Los detalles los acordamos contigo antes del viaje.
    - q: ¿Puedo visitar Maikiuants sin hacer un tour?
      a: >-
        Las visitas se acuerdan siempre antes con la comunidad. Escríbenos y vemos qué es
        posible.
    - q: ¿Puedo cambiar o cancelar una reserva?
      a: >-
        Sí. Escríbenos lo antes posible: los cambios y las cancelaciones los acordamos
        personalmente contigo.
    - q: ¿Cómo puedo apoyar sin viajar?
      a: >-
        Compartiendo nuestras novedades o ayudando con traducción, fotografía o redes sociales.
        Con parte de nuestros ingresos, Kampuntin ya brinda ayuda social a familias de la comunidad
        en salud, educación y necesidades urgentes. Si quieres apoyar este trabajo con una donación,
        escríbenos.
