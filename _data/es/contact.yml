# Página de contacto – español
hero:
  eyebrow: Contacto
  title: Escríbenos
  lead: >-
    ¿Preguntas sobre los tours, el voluntariado o una colaboración científica? Escríbenos por WhatsApp o por correo. Respondemos personalmente y normalmente en el día. En la selva la señal es limitada, así que ten paciencia.
  image: "/assets/img/ilustraciones/detalle-4.jpg"
  image_alt: Ilustración de plantas de la selva amazónica
direct:
  whatsapp: WhatsApp
  whatsapp_cta: WhatsApp
  email: Correo electrónico
  email_hint: "Correo general:"
  tips_title: Para responderte rápido, cuéntanos
  tips:
    - si te interesa un tour, el voluntariado u otra cosa,
    - las fechas que tienes en mente,
    - cuántas personas vienen,
    - y un poco sobre ti.
location:
  title: Dónde estamos
  text: >-
    Maikiuants está en la provincia de Morona Santiago, en la Amazonía sur del Ecuador. La
    carretera hacia la comunidad sale de Limón Indanza; desde allí son unas dos horas y media,
    normalmente en taxi (aprox. 50–60 USD). Los tours empiezan y terminan en Cuenca.
    Los demás detalles del viaje los acordamos antes de tu llegada.
    La carretera no aparece en Google Maps, pero sí en OpenStreetMap.
  map_link: Ver en OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"

faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Cuánto tardan en responder?
      a: >-
        Normalmente en pocas horas. La señal es limitada en la selva, así que a veces tardamos un poco más. Por WhatsApp suele ser más rápido.
    - q: ¿En qué idiomas puedo escribir?
      a: >-
        Lo mejor es en español. Si no hablas español, escríbenos igual: traduciremos tu mensaje.
    - q: ¿Cómo puedo apoyar sin viajar?
      a: >-
        Compartiendo nuestras novedades o ayudando con traducción, fotografía o redes sociales.
        Con parte de nuestros ingresos, Kampuntin ya brinda ayuda social a familias de la comunidad
        en salud, educación y necesidades urgentes. Si quieres apoyar este trabajo con una donación,
        escríbenos.
