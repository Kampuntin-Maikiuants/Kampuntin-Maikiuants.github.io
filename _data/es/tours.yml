intro:
  title: Sobre el tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Miembros de la comunidad compartiendo bebida y artesanía con visitantes
  text: |-
    El viaje dura **22 días**. Empieza y termina en Cuenca; en el centro están unos diez días con
    la comunidad en Maikiuants, seguidos de una expedición a la Cueva de los Tayos y un viaje en
    canoa a comunidades shuar del Perú.

    La comunidad te recibe para un **intercambio cultural y espiritual**. Junto con personas de la comunidad
    compartes el alojamiento en una jea tradicional, cocinas y comes con ellas y aprendes sobre la
    selva y sobre el uso de las plantas medicinales. Tenemos la mejor ducha del mundo: el río.

    Aprenderás a cocinar tus nuevos platos favoritos y a cosechar lo que necesitas para ellos.
    Hacemos música juntos y te mostramos cómo tocar nuestras flautas hechas a mano. Los días
    combinan caminatas por el bosque, trabajo en el vivero y la huerta, artesanía, cocina y
    tiempo libre.


life:
  title: La vida en la jea
  text: Así se vive durante tu estancia en Maikiuants.



experience:
  title: "Lo que puedes esperar de tu tour"
  arrival_title: "Llegada a Cuenca"
  arrival: >-
    El viaje empieza en Cuenca, a 2.800 metros. Tras un día libre para aclimatarte, conocemos el centro histórico, el mercado local y el museo Pumapungo. En bus viajamos a Limón Indanza, donde un chamán shuar guía una ceremonia de purificación, y desde allí seguimos en 4×4 por la Cordillera del Cóndor hasta Maikiuants, donde la comunidad nos recibe con baile y fiesta.
  activities_title: "Unos diez días en Maikiuants"
  activities_note: >-
    Las actividades dependen de la temporada y del calendario de la comunidad. Con gusto escuchamos tus deseos e intereses y los incluimos.
  activities:
    - "Conocer el pueblo y la comunidad"
    - "Participar en una minga (el día de trabajo comunitario para cuidar el pueblo)"
    - "Comer con toda la comunidad en el pueblo"
    - "Cerámica con arcilla de los alrededores"
    - "Cosechar juntos verduras y frutas de nuestras plantaciones"
    - "Hacer música juntos"
    - "Una larga caminata por la selva y las plantas medicinales tradicionales"
    - "Aprender a tallar lanzas tradicionales"
    - "Práctica con la cerbatana (con frutas como blanco)"
    - "Intercambio culinario: cocinar juntos platos de la cultura shuar y también de los visitantes"
    - "Jugar fútbol con los niños del pueblo"
    - "Una caminata hasta las cascadas grandes más cercanas"
    - "Bañarse en el río"
    - "Danzas y música"
    - "Pesca selectiva nocturna"
    - "Paseo en balsa por el río Coangos"
    - "Caminatas a lugares sagrados y cascadas"
    - "Ceremonia de purificación"
    - "Aprender a hacer artesanías y tus propias joyas"
    - "Conocer cómo la comunidad defiende su territorio frente a la minería"
    - "Instalar una cámara trampa para observar la fauna"
    - "Un baño de vapor shuar con plantas medicinales"
    - "Varios días como «nómadas de la selva»: caminatas por el territorio y una noche en un refugio construido por nosotros mismos"
  departure_title: "Despedida, expedición y regreso"
  departure: >-
    Al final de la estancia en Maikiuants nos despedimos con una gran fiesta junto a toda la comunidad: una gran cena, música y baile. También hay un intercambio de regalos: la comunidad entrega regalos a los visitantes y, si quieren, los visitantes también a la gente de aquí. Después viene la expedición a la Cueva de los Tayos: en canoa hasta la comunidad de Coangos, un descenso de 60 metros con cuerdas y una noche en la cueva. Luego viajamos en canoa tradicional por el río Santiago hasta comunidades shuar del lado peruano, con una laguna llena de fauna y una última noche en el bosque. En Limón Indanza hacemos juntos un balance del viaje y volvemos a Cuenca para una cena de despedida. El día 22 vuelas de regreso.

