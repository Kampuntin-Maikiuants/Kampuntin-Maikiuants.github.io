faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Necesito una buena condición física?
      a: >-
        Basta una condición física normal. Caminamos por senderos con barro, subidas y cruces de
        río. Si tienes alguna limitación, avísanos y buscamos alternativas.
    - q: ¿Hay electricidad, señal de teléfono e internet?
      a: >-
        La cocina funciona con energía solar y ahí puedes cargar tu teléfono. En la jea no hay wifi
        ni señal de teléfono, pero en el pueblo, a unos 35 minutos a pie, hay wifi gratis.
    - q: ¿Qué idiomas se hablan?
      a: >-
        En Maikiuants se habla shuar chicham y español; otros idiomas casi no. Durante el tour te
        acompañan nuestro guía internacional e intérpretes, y siempre encontramos una manera de
        entendernos.
    - q: ¿Es seguro?
      a: >-
        La comunidad de Maikiuants se basa en la confianza, y moverse dentro de la comunidad es seguro. En las excursiones y en la selva siempre vas con miembros de la comunidad que conocen bien la región.
