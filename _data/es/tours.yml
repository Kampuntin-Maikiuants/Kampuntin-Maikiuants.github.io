price:
  title: Precio
  per: por persona
  text: >-
    Todo incluido desde Cuenca: alojamiento, comidas, todos los traslados durante el viaje, guías,
    intérpretes, seguro de viaje, seguridad y actividades. La reserva se hace a través de Raíces, y
    en Maikiuants Kampuntin organiza el viaje. Pagamos a guías y cocineras locales, compramos los alimentos en la comunidad y
    apoyamos económicamente a Maikiuants. El pago y los demás detalles los acordamos
    personalmente contigo. Si el viaje te inspira pero te faltan los fondos, escríbenos: te
    aconsejamos cómo organizar eventos para recaudarlos.

