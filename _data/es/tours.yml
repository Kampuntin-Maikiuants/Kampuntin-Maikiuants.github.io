intro:
  title: Qué te espera
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Miembros de la comunidad compartiendo bebida y artesanía con visitantes
  text: |-
    La comunidad te recibe para un **intercambio cultural**. Junto con personas de la comunidad
    compartes el alojamiento en una jea tradicional, cocinas y comes con ellas y aprendes sobre la
    selva. Tenemos la mejor ducha del mundo: el río.

    Aprenderás a cocinar tus nuevos platos favoritos y a cosechar lo que necesitas para ellos.
    Hacemos música juntos y te mostramos cómo tocar nuestras flautas hechas a mano. Los días
    combinan caminatas por el bosque, trabajo en el vivero y la huerta, artesanía, cocina y
    tiempo libre.

quote:
  text: En nuestro pueblo no se trata de turismo, sino de intercambio cultural.
  source: Comunidad de Maikiuants

life:
  title: La vida en la jea
  text: Así se vive durante tu estancia en Maikiuants.

activities:
  title: Actividades según tus deseos y el tiempo
  intro: "Cada tour se adapta al grupo. Algunas de las cosas que podemos hacer juntos:"
  image: "/assets/img/fotos/cascada.jpg"
  image_alt: Cascada en medio de la selva cerca de Maikiuants
  items:
    - Caminatas a lugares sagrados y cascadas
    - Cosecha de frutas nativas
    - Baño de vapor con plantas medicinales
    - Preparación de comida típica shuar
    - Danzas y música
    - Pesca
    - Ceremonia de purificación
    - Elaboración de artesanías

itinerary:
  title: Así puede ser tu tour
  note: El programa es orientativo. El clima, el río y la vida de la comunidad marcan el ritmo.
  days:
    - title: Llegada
      text: Te recibe en Quito nuestro guía internacional. Juntos viajamos en buseta hasta Cuenca y en taxi hasta Maikiuants, donde nos da la bienvenida la comunidad.
    - title: Conocer el pueblo
      text: Recorremos Maikiuants y conocemos a la comunidad y a las familias. Por la tarde, baño en el río.
    - title: La selva que cura
      text: Una caminata larga por la selva con un guía shuar, para conocer las plantas medicinales tradicionales.
    - title: Minga
      text: Participamos en una minga, el día de trabajo comunitario para cuidar el pueblo. Después comemos todos juntos con la comunidad.
    - title: Barro de nuestra tierra
      text: Cerámica con arcilla de los alrededores y un vistazo a la artesanía tradicional.
    - title: De la chacra a la cocina
      text: Cosechamos juntos frutas y verduras de nuestras plantaciones y cocinamos especialidades tradicionales.
    - title: Las cascadas
      text: Paseo en bote hasta las cascadas grandes más cercanas.
    - title: Lanzas y fútbol
      text: Aprendemos a tallar lanzas tradicionales. Por la tarde, fútbol con los niños del pueblo.
    - title: Música y danza
      text: Hacemos música juntos, vemos y aprendemos danzas tradicionales y celebramos la despedida.
    - title: Regreso
      text: Último desayuno juntos, despedida y viaje de regreso a Quito con el guía internacional.

included:
  title: Incluido
  items:
    - Traslado desde Quito con nuestro guía internacional (en buseta hasta Cuenca y en taxi hasta Maikiuants)
    - Alojamiento en la jea (literas o un lugar para tu propia hamaca)
    - Todas las comidas durante diez días – compramos los alimentos y los preparan cocineras de la comunidad
    - Guías de la comunidad e intérpretes
    - Seguridad y acompañamiento durante todo el tour
    - Todas las actividades del programa
    - Cocina y electricidad con energía solar
    - Wifi gratis en el pueblo (a unos 35 minutos a pie del alojamiento)
    - Un río para bañarse

not_included:
  title: No incluido
  items:
    - Vuelos hasta Quito
    - Seguro de viaje con cobertura médica (obligatorio)
    - Gastos personales y artesanías – no hay un supermercado cerca

packing:
  title: Qué llevar
  items:
    - Botas de caucho (también se pueden comprar en el centro comunitario)
    - Ropa ligera de manga larga
    - Chaqueta impermeable
    - Toalla de secado rápido
    - Mosquitero
    - Sábanas
    - Jabón biodegradable
    - Repelente de mosquitos
    - Botella de agua

price:
  title: Precio
  amount: "2.000 USD"
  per: por persona, 10 días
  text: >-
    Todo incluido durante los diez días: traslado desde Quito, alojamiento, comidas, guías,
    intérpretes, seguridad y actividades. Organizamos los tours junto con la organización belga
    Raíces. Pagamos a guías y cocineras locales, compramos los alimentos en la comunidad y el 5 % de
    los ingresos va directamente a Maikiuants. El pago y los demás detalles los acordamos
    personalmente contigo.

