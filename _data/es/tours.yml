# Die beiden Reisen. Termine stehen in _data/tour_dates.yml (Feld trip: espiritual oder arutam).
trips_title: Dos viajes
trips_intro: "Los dos viajes empiezan y terminan en Limón Indanza; la mejor forma de llegar es desde Cuenca. Elige el que mejor te va."
trips:
  espiritual:
    name: Viaje espiritual
    days: 8 días
    when: Abril – mayo 2027
    text: >-
      Una inmersión en la espiritualidad shuar: la ceremonia de la chonta (el Año Nuevo shuar),
      plantas medicinales, rituales tradicionales y la caminata a la cascada sagrada de Arutam.
    link: Ver el programa
  arutam:
    name: Viaje Arutam
    days: 10 días
    when: Agosto – septiembre 2027
    text: >-
      Diez días con la comunidad en Maikiuants: caminatas por la selva hacia cascadas y cuevas, cultura shuar, cerámica, plantas medicinales, la cascada sagrada y una noche en la selva.
    link: Ver el programa


# Hinweis unter den beiden Reisen: Schülerreisen auf Anfrage
school_trips:
  title: "Viajes para escuelas:"
  text: "También organizamos viajes de 10 días para grupos escolares, a petición."

intro:
  title: Sobre el tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Miembros de la comunidad compartiendo bebida y artesanía con visitantes
  text: |-
    Los tours los organiza **Kampuntin**, la organización de turismo comunitario de Maikiuants: nosotros mismos, junto con toda la comunidad.

    La comunidad te recibe para un **intercambio cultural y espiritual**. Junto con personas de la comunidad
    compartes el alojamiento en una jea tradicional, cocinas y comes con ellas y aprendes sobre la
    selva y sobre el uso de las plantas medicinales. Tenemos la mejor ducha del mundo: el río.

    Aprenderás a cocinar tus nuevos platos favoritos y a cosechar lo que necesitas para ellos.
    Hacemos música juntos y te mostramos cómo tocar nuestras flautas hechas a mano. Los días
    combinan caminatas por el bosque, trabajo en el vivero y la huerta, artesanía, cocina y
    tiempo libre.

    Para los shuar, **Arutam** es la fuerza presente en las cascadas, que une a todos los seres vivos; un lugar de introspección y de conexión con la naturaleza. Los dos viajes llevan a la cascada sagrada.


life:
  title: La vida en la jea
  text: Así se vive durante tu estancia en Maikiuants.



experience:
  title: "El viaje Arutam: 10 días"
  intro: "Diez días en el territorio shuar de Maikiuants: selva, cascadas, cultura y vida en comunidad."
  arrival_title: "Llegada a Limón Indanza"
  arrival: "El viaje empieza en Limón Indanza. Desde allí viajamos juntos unas dos horas y media hasta Maikiuants, donde la comunidad te recibe con baile y fiesta."
  activities_title: "En Maikiuants"
  activities_note: >-
    Las actividades dependen de la temporada y del calendario de la comunidad. Con gusto escuchamos tus deseos e intereses y los incluimos.
  activities:
    - "Bienvenida de la comunidad con baile y fiesta"
    - "Caminatas por la selva hacia cascadas y cuevas"
    - "Historias de los mayores sobre el pueblo shuar"
    - "Conocer cómo la comunidad defiende su territorio frente a la minería"
    - "Instalar una cámara trampa para observar la fauna"
    - "Día de Nunkui: sembrar, plantar y cosechar en las parcelas familiares con cantos anent"
    - "Cocinar la cosecha y preparar chicha de yuca"
    - "Cerámica con las mujeres de la comunidad: recoger la arcilla, modelar, pintar y cocer"
    - "Día de Tsunki: reconocer y recolectar plantas medicinales"
    - "Un baño de vapor shuar con plantas medicinales"
    - "Caminata a la cascada sagrada y ceremonia sobre la cosmovisión shuar"
    - "Tejer la changuina, la canasta tradicional"
    - "Probar comidas de la selva"
    - "El río Coangos y las historias de las hachas prehispánicas"
    - "Construir un refugio (ayamte) y pasar la noche en la selva"
  departure_title: "Despedida y regreso"
  departure: "Al final nos despedimos con una gran fiesta junto a toda la comunidad: una gran cena, música y baile. También hay un intercambio de regalos: la comunidad entrega regalos a los visitantes y, si quieren, los visitantes también a la gente de aquí. El día 10 regresamos juntos a Limón Indanza."

# Viaje espiritual (8 días) – gleicher Aufbau wie experience
