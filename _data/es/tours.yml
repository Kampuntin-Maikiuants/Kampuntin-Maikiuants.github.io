# Viaje espiritual (11 días) – gleicher Aufbau wie experience
spiritual:
  title: "El viaje espiritual: 11 días"
  intro: Un viaje más corto, centrado en la espiritualidad shuar y en la conexión con la naturaleza.
  arrival_title: Llegada a Cuenca
  arrival: >-
    Nos encontramos en Cuenca y nos conocemos. Al día siguiente visitamos el museo Pumapungo y
    hacemos una limpieza espiritual; luego entramos al territorio shuar.
  activities_title: Ceremonias en Maikiuants
  activities:
    - "Cosechar la chonta en las huertas con la comunidad"
    - "La ceremonia de la chonta: el Año Nuevo shuar, con chicha de chonta"
    - "Plantas medicinales y baño de vapor shuar"
    - "Una ceremonia ancestral guiada por los shuar, con un tiempo de ayuno"
    - "La caminata a la cascada sagrada de Arutam, con cantos sagrados (anent)"
    - "Una noche en la selva, en un refugio construido con materiales del bosque"
  activities_note: >-
    Antes del viaje te explicamos con detalle cómo se desarrollan las ceremonias y cómo prepararte.
  departure_title: Cierre y regreso
  departure: >-
    Al final compartimos e interpretamos juntos lo vivido. El día 11 regresamos a Cuenca.

