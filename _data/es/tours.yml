price:
  title: Precio
  amount: "3.890 €"
  per: por persona, 22 días
  text: >-
    Todo incluido durante 22 días desde Cuenca: alojamiento, comidas, todos los traslados durante
    el viaje, guías, intérpretes, seguro de viaje, seguridad y actividades. Organizamos los tours junto con la organización belga
