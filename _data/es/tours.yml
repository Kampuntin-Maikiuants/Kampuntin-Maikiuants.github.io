price:
  title: Precio
  per: por persona
  # Ohne „amount“ bei den Reisen steht „on_request“ statt eines Preises
  on_request: "Precio a consultar"
  button: "Consultar precio"
  text: >-
    Escríbenos y te enviamos el precio de tu viaje con todos los detalles. Incluye alojamiento, comidas, el traslado desde Limón Indanza, guías y actividades. Pagamos a guías y cocineras locales, compramos los alimentos en la comunidad y apoyamos económicamente a Maikiuants. Si el viaje te inspira pero te faltan los fondos, escríbenos: te aconsejamos cómo organizar eventos para recaudarlos.

