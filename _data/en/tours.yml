intro:
  title: About the tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Community members sharing a drink and handicrafts with visitors
  text: |-
    The journeys are run by **Raíces**, our sister organisation in Belgium: Raíces organises the journey and handles the bookings. In Maikiuants, **Kampuntin** takes care of the organisation and support in the community.

    The community welcomes you for a **cultural and spiritual exchange**. Together with people from the
    community you share the accommodation in a traditional jea, cook and eat together and learn
    about the rainforest and how medicinal plants are used. We have the best shower in the world: the river.

    You'll learn how to cook your new favourite dishes — and how to harvest the ingredients for
    them. We make music together and show you how to play our handmade flutes. The days combine
    forest walks, work in the nursery and gardens, crafts, cooking and free time.

    For the Shuar, **Arutam** is the force present in the waterfalls that connects all living beings – a place of introspection and connection with nature. Both journeys lead to the sacred waterfall.


life:
  title: Life in the jea
  text: This is how you'll live during your stay in Maikiuants.



experience:
  title: "The Arutam journey: 22 days"
  intro: The big adventure through Shuar territory, from Cuenca to the Cueva de los Tayos and the Río Santiago. Raíces organises the journey; in Maikiuants, Kampuntin welcomes and accompanies you.
  arrival_title: "Arrival in Cuenca"
  arrival: >-
    The journey starts in Cuenca, at 2,800 metres. After a free day to acclimatise, we explore the old town, the local market and the Pumapungo museum. We travel by bus to Limón Indanza, where a Shuar shaman leads a purification ceremony, and from there continue by 4×4 through the Cordillera del Cóndor to Maikiuants, where the community welcomes us with dance and celebration.
  activities_title: "About ten days in Maikiuants"
  activities_note: >-
    The activities depend on the season and the community's schedule. We are happy to hear and include your wishes and interests.
  activities:
    - "Welcome from the community with dance and celebration"
    - "Rainforest walks to waterfalls and caves"
    - "Stories from the elders about the Shuar people"
    - "Learning how the community defends its territory against mining"
    - "Setting up a camera trap to observe wildlife"
    - "Nunkui day: sowing, planting and harvesting in the family fields with anent songs"
    - "Cooking the harvest and making cassava chicha"
    - "Pottery with the women of the community: collecting clay, shaping, painting and firing"
    - "Tsunki day: recognising and collecting medicinal plants"
    - "A Shuar steam bath with medicinal plants"
    - "A walk to the sacred waterfall and a ceremony about the Shuar worldview"
    - "Weaving the changuina, the traditional basket"
    - "Tasting food from the rainforest"
    - "The Río Coangos and the stories of the pre-Hispanic axes"
    - "Building a shelter (ayamte) and spending the night in the rainforest"
  departure_title: "Farewell, expedition and return"
  departure: >-
    At the end of the stay in Maikiuants we say goodbye with a big celebration with the whole community: a large dinner, music and dancing. There is also a gift exchange – the community gives presents to the visitors, and visitors can give something to the people here too if they like. Then comes the expedition to the Cueva de los Tayos: by boat to the Coangos community, a 60-metre rope descent and a night in the cave. Then we travel by traditional canoe on the Río Santiago to Shuar communities on the Peruvian side, with a lagoon full of wildlife and a last night in the forest. In Limón Indanza we look back on the journey together and return to Cuenca for a farewell dinner. On day 22 you fly home.

# Spiritual journey (11 days) – same structure as experience
spiritual:
  title: "The spiritual journey: 11 days"
  intro: A shorter journey focused on Shuar spirituality and the connection with nature. Raíces organises the journey; in Maikiuants, Kampuntin welcomes and accompanies you.
  arrival_title: Arrival in Cuenca
  arrival: >-
    We meet in Cuenca and get to know each other. The next day we visit the Pumapungo museum and
    take part in a spiritual cleansing; then we enter Shuar territory.
  activities_title: Ceremonies in Maikiuants
  activities:
    - "Harvesting chonta in the gardens with the community"
    - "The chonta ceremony: the Shuar New Year, with chonta chicha"
    - "Medicinal plants and a Shuar steam bath"
    - "An ancestral ceremony guided by the Shuar, with a time of fasting"
    - "The walk to the sacred Arutam waterfall, with sacred songs (anent)"
    - "A night in the rainforest in a shelter built from forest materials"
  activities_note: >-
    Before the journey we explain in detail how the ceremonies work and how to prepare.
  departure_title: Closing and return
  departure: >-
    At the end we share and reflect on the experience together. On day 11 we return to Cuenca.

