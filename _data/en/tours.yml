intro:
  title: About the tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Community members sharing a drink and handicrafts with visitors
  text: |-
    The journey lasts **22 days**. It starts and ends in Cuenca; at its heart are about ten days
    with the community in Maikiuants, followed by an expedition to the Cueva de los Tayos and a
    canoe trip to Shuar communities in Peru.

    The community welcomes you for a **cultural and spiritual exchange**. Together with people from the
    community you share the accommodation in a traditional jea, cook and eat together and learn
    about the rainforest and how medicinal plants are used. We have the best shower in the world: the river.

    You'll learn how to cook your new favourite dishes — and how to harvest the ingredients for
    them. We make music together and show you how to play our handmade flutes. The days combine
    forest walks, work in the nursery and gardens, crafts, cooking and free time.


life:
  title: Life in the jea
  text: This is how you'll live during your stay in Maikiuants.



experience:
  title: "What you can expect from your tour"
  arrival_title: "Arrival in Cuenca"
  arrival: >-
    The journey starts in Cuenca, at 2,800 metres. After a free day to acclimatise, we explore the old town, the local market and the Pumapungo museum. We travel by bus to Limón Indanza, where a Shuar shaman leads a purification ceremony, and from there continue by 4×4 through the Cordillera del Cóndor to Maikiuants, where the community welcomes us with dance and celebration.
  activities_title: "About ten days in Maikiuants"
  activities_note: >-
    The activities depend on the season and the community's schedule. We are happy to hear and include your wishes and interests.
  activities:
    - "Getting to know the village and the community"
    - "Taking part in a minga (the community work day that cares for the village)"
    - "Eating with the whole community in the village"
    - "Pottery with clay from the immediate surroundings"
    - "Harvesting vegetables and fruit together from our plantations"
    - "Making music together"
    - "A long walk through the rainforest and traditional medicinal plants"
    - "Learning how to carve traditional spears"
    - "Blowgun practice (with fruit as targets)"
    - "A culinary exchange: cooking dishes from Shuar culture and from the visitors' own cultures together"
    - "Playing football with the children of the village"
    - "A walk to the nearest big waterfalls"
    - "Bathing in the river"
    - "Dance and music"
    - "Selective night fishing"
    - "A raft trip on the Río Coangos"
    - "Walks to sacred places and waterfalls"
    - "Purification ceremony"
    - "Learning to make handicrafts and your own jewellery"
    - "Learning how the community defends its territory against mining"
    - "Setting up a camera trap to observe wildlife"
    - "A Shuar steam bath with medicinal plants"
    - "Several days as \"nomads of the jungle\": hikes through the territory and a night in a shelter we build ourselves"
  departure_title: "Farewell, expedition and return"
  departure: >-
    At the end of the stay in Maikiuants we say goodbye with a big celebration with the whole community: a large dinner, music and dancing. There is also a gift exchange – the community gives presents to the visitors, and visitors can give something to the people here too if they like. Then comes the expedition to the Cueva de los Tayos: by boat to the Coangos community, a 60-metre rope descent and a night in the cave. Then we travel by traditional canoe on the Río Santiago to Shuar communities on the Peruvian side, with a lagoon full of wildlife and a last night in the forest. In Limón Indanza we look back on the journey together and return to Cuenca for a farewell dinner. On day 22 you fly home.

