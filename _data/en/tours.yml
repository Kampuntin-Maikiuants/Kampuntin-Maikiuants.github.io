faq:
  title: Frequently asked questions
  items:
    - q: Do I need to be very fit?
      a: >-
        Normal fitness is enough. We walk on muddy trails with climbs and river crossings. If you
        have any limitations, let us know and we will find alternatives.
    - q: Is there electricity, phone signal and internet?
      a: >-
        A solar panel powers the kitchen, and you can charge your phone there too. There's no
        phone signal, but internet is available at the community centre, about a 20–25-minute walk
        away.
    - q: Which languages are spoken?
      a: >-
        In Maikiuants people speak Shuar Chicham and Spanish – hardly any other languages. During the
        tour, our international guide and interpreters accompany you, and we always find a way to
        understand each other.
    - q: Do you have experience hosting visitors?
      a: >-
        Yes. At the beginning we learned as we went, but today we have a lovely experience of
        welcoming and caring for our visitors and exchanging knowledge from our territory.
    - q: Is it safe?
      a: >-
        Yes. From your arrival in Quito, our international guide accompanies you, and in the forest
        you're always with community members who know it well. Safety is included in the price.
        [Describe first-aid kit, emergency communication and evacuation plan.]
