intro:
  title: What you can expect
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Community members sharing a drink and handicrafts with visitors
  text: |-
    The community welcomes you for a **cultural exchange**. Together with people from the
    community you share the accommodation in a traditional jea, cook and eat together and learn
    about the rainforest. We have the best shower in the world: the river.

    You'll learn how to cook your new favourite dishes — and how to harvest the ingredients for
    them. We make music together and show you how to play our handmade flutes. The days combine
    forest walks, work in the nursery and gardens, crafts, cooking and free time.

quote:
  text: In our village it's not about tourism, but about cultural exchange.
  source: The Maikiuants community

life:
  title: Life in the jea
  text: This is how you'll live during your stay in Maikiuants.

activities:
  title: Activities to suit your wishes and time
  intro: "Every tour is adapted to the group. Some of the things we can do together:"
  image: "/assets/img/fotos/cascada.jpg"
  image_alt: Waterfall in the middle of the rainforest near Maikiuants
  items:
    - Walks to sacred places and waterfalls
    - Harvesting native fruits
    - Steam bath with medicinal plants
    - Cooking traditional Shuar food
    - Dance and music
    - Fishing
    - Purification ceremony
    - Making handicrafts

itinerary:
  title: What your tour could look like
  note: This programme is a guide. Weather, the river and community life set the pace.
  days:
    - title: Arrival
      text: Arrival in Limón Indanza and a journey of about 2.5 hours by 4×4 taxi to Maikiuants. Welcome by the community.
    - title: Getting to know the community
      text: A walk through Maikiuants, the school and the family gardens (aja). In the afternoon, your first river bath.
    - title: The healing forest
      text: Forest walk with a Shuar guide. Medicinal plants, useful trees and how to read animal tracks.
    - title: Hands in the soil
      text: Morning in the plant nursery and agroforestry plots. Free afternoon to rest or play with the children.
    - title: Clay and fibres
      text: Pottery and weaving with the community's Nunkui handicraft association.
    - title: Excursion
      text: Full-day trip to a waterfall in the middle of the forest, with a leaf-wrapped lunch.
    - title: Science in the forest
      text: With the para-ecologists, we check camera traps and learn how animals and rivers are monitored.
    - title: Shuar cooking
      text: We prepare traditional dishes such as ayampaco and cassava chicha. Music with handmade flutes in the evening.
    - title: Minga
      text: Communal work together with the families, followed by a farewell celebration with music and songs.
    - title: Departure
      text: Last breakfast together, goodbyes and the journey back to Limón Indanza.

included:
  title: Included
  items:
    - Accommodation in the jea (bunk beds or a place for your own hammock)
    - All meals for ten days (we cook together)
    - Community guides
    - Programme activities
    - Solar-powered kitchen and electricity
    - Free internet at the community centre (about a 20–25-minute walk from the accommodation)
    - A river to bathe in

not_included:
  title: Not included
  items:
