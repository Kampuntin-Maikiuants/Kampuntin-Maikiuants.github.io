price:
  title: Price
  per: per person
  text: >-
    All-inclusive from Cuenca: accommodation, meals, all transport during the journey, guides,
    translators and activities. Raíces organises the journey and the booking; in Maikiuants, Kampuntin takes care of the organisation in the community. We
    pay local guides and cooks, buy food within the community and support Maikiuants
    financially. Payment and all other details are arranged personally with you. If the journey inspires you but you lack the funds, write to us – we can advise you on organising events to raise them.

