itinerary:
  title: What your tour could look like
  note: This programme is a guide. Weather, the river and community life set the pace.
  days:
    - title: Arrival
      text: Our international guide welcomes you in Quito. Together we travel by minibus to Cuenca and by taxi to Maikiuants, where the community welcomes us.
    - title: Getting to know the community
      text: A walk through Maikiuants, the school and the family gardens (aja). In the afternoon, your first river bath.
    - title: The healing forest
      text: Forest walk with a Shuar guide. Medicinal plants, useful trees and how to read animal tracks.
    - title: Hands in the soil
      text: Morning in the plant nursery and agroforestry plots. Free afternoon to rest or play with the children.
    - title: Clay and fibres
      text: Pottery and weaving with the community's Nunkui handicraft association.
    - title: Excursion
      text: Full-day trip to a waterfall in the middle of the forest, with a leaf-wrapped lunch.
    - title: Science in the forest
      text: With the para-ecologists, we check camera traps and learn how animals and rivers are monitored.
    - title: Shuar cooking
      text: We prepare traditional dishes such as ayampaco and cassava chicha. Music with handmade flutes in the evening.
    - title: Minga
      text: Communal work together with the families, followed by a farewell celebration with music and songs.
    - title: Departure
      text: Last breakfast together, goodbyes and the journey back to Quito with the international guide.

included:
  title: Included
  items:
    - Transfer from Quito with our international guide (minibus to Cuenca, then taxi to Maikiuants)
    - Accommodation in the jea (bunk beds or a place for your own hammock)
    - All meals for ten days – we buy the food and community cooks prepare it
    - Community guides and interpreters
    - Safety and support throughout the tour
    - All programme activities
    - Solar-powered kitchen and electricity
    - Free internet at the community centre (about a 20–25-minute walk from the accommodation)
    - A river to bathe in

not_included:
  title: Not included
  items:
