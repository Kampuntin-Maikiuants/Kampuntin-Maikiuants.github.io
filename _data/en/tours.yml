intro:
  title: About the tour
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Community members sharing a drink and handicrafts with visitors
  text: |-
    The tours are organised by **Kampuntin**, the community tourism organisation of Maikiuants: by us, together with the whole community.

    The community welcomes you for a **cultural and spiritual exchange**. Together with people from the
    community you share the accommodation in a traditional jea, cook and eat together and learn
    about the rainforest and how medicinal plants are used. We have the best shower in the world: the river.

    You'll learn how to cook your new favourite dishes — and how to harvest the ingredients for
    them. We make music together and show you how to play our handmade flutes. The days combine
    forest walks, work in the nursery and gardens, crafts, cooking and free time.

    For the Shuar, **Arutam** is the force present in the waterfalls that connects all living beings – a place of introspection and connection with nature. Both journeys lead to the sacred waterfall.


life:
  title: Life in the jea
  text: This is how you'll live during your stay in Maikiuants.



experience:
  title: "The Arutam journey: 10 days"
  intro: "Ten days in the Shuar territory of Maikiuants: rainforest, waterfalls, culture and community life."
  arrival_title: "Arrival in Limón Indanza"
  arrival: "The journey starts in Limón Indanza. From there we travel together for about two and a half hours to Maikiuants, where the community welcomes you with dance and celebration."
  activities_title: "In Maikiuants"
  activities_note: >-
    The activities depend on the season and the community's schedule. We are happy to hear and include your wishes and interests.
  activities:
    - "Welcome from the community with dance and celebration"
    - "Rainforest walks to waterfalls and caves"
    - "Stories from the elders about the Shuar people"
    - "Learning how the community defends its territory against mining"
    - "Setting up a camera trap to observe wildlife"
    - "Nunkui day: sowing, planting and harvesting in the family fields with anent songs"
    - "Cooking the harvest and making cassava chicha"
    - "Pottery with the women of the community: collecting clay, shaping, painting and firing"
    - "Tsunki day: recognising and collecting medicinal plants"
    - "A Shuar steam bath with medicinal plants"
    - "A walk to the sacred waterfall and a ceremony about the Shuar worldview"
    - "Weaving the changuina, the traditional basket"
    - "Tasting food from the rainforest"
    - "The Río Coangos and the stories of the pre-Hispanic axes"
    - "Building a shelter (ayamte) and spending the night in the rainforest"
  departure_title: "Farewell and return"
  departure: "At the end we say goodbye with a big celebration with the whole community: a large dinner, music and dancing. There is also a gift exchange – the community gives presents to the visitors, and visitors can give something to the people here too if they like. On day 10 we travel back together to Limón Indanza."

