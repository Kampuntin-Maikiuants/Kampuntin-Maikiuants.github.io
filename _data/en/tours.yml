price:
  title: Price
  amount: "2,000 USD"
  per: per person, 10 days
  text: >-
    All-inclusive for ten days: transfer from Quito, accommodation, meals, guides, interpreters,
    safety and activities. We organise the tours together with the Belgian organisation Raíces. We
