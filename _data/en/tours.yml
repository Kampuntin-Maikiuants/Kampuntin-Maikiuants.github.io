intro:
  title: What you can expect
  image: "/assets/img/fotos/cultura.jpg"
  image_alt: Community members sharing a drink and handicrafts with visitors
  text: |-
    The community welcomes you for a **cultural exchange**. Together with people from the
    community you share the accommodation in a traditional jea, cook and eat together and learn
    about the rainforest. We have the best shower in the world: the river.

    You'll learn how to cook your new favourite dishes — and how to harvest the ingredients for
    them. We make music together and show you how to play our handmade flutes. The days combine
    forest walks, work in the nursery and gardens, crafts, cooking and free time.

quote:
  text: In our village it's not about tourism, but about cultural exchange.
  source: The Maikiuants community

life:
  title: Life in the jea
  text: This is how you'll live during your stay in Maikiuants.

activities:
  title: Activities to suit your wishes and time
  intro: "Every tour is adapted to the group. Some of the things we can do together:"
  image: "/assets/img/fotos/cascada.jpg"
  image_alt: Waterfall in the middle of the rainforest near Maikiuants
  items:
    - Walks to sacred places and waterfalls
    - Harvesting native fruits
    - Steam bath with medicinal plants
    - Cooking traditional Shuar food
    - Dance and music
    - Fishing
    - Purification ceremony
    - Making handicrafts

itinerary:
  title: What your tour could look like
  note: This programme is a guide. Weather, the river and community life set the pace.
  days:
    - title: Arrival
      text: Our international guide welcomes you in Quito. Together we travel by minibus to Cuenca and by taxi to Maikiuants, where the community welcomes us.
    - title: Getting to know the village
      text: We walk through Maikiuants and meet the community and the families. In the afternoon, a bath in the river.
    - title: The healing forest
      text: A long walk through the rainforest with a Shuar guide to learn about traditional medicinal plants.
    - title: Minga
      text: We take part in a minga, the community work day that keeps the village in good shape. Afterwards we all eat together with the community.
    - title: Clay from our land
      text: Pottery with clay from the surroundings and a look at traditional handicrafts.
    - title: From the garden to the kitchen
      text: We harvest fruit and vegetables from our plantations together and cook traditional specialities.
    - title: The waterfalls
      text: A boat trip to the nearest big waterfalls.
    - title: Spears and football
      text: We learn how to carve traditional spears. In the afternoon, football with the village children.
    - title: Music and dance
      text: We make music together, watch and learn traditional dances and celebrate our farewell.
    - title: Departure
      text: Last breakfast together, goodbyes and the journey back to Quito with the international guide.

included:
  title: Included
  items:
    - Transfer from Quito with our international guide (minibus to Cuenca, then taxi to Maikiuants)
    - Accommodation in the jea (bunk beds or a place for your own hammock)
    - All meals for ten days – we buy the food and community cooks prepare it
    - Community guides and interpreters
    - Safety and support throughout the tour
    - All programme activities
    - Solar-powered kitchen and electricity
    - Free wifi in the village (about a 35-minute walk from the accommodation)
    - A river to bathe in

not_included:
  title: Not included
  items:
