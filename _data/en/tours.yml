faq:
  title: Frequently asked questions
  items:
    - q: Do I need to be very fit?
      a: >-
        Good basic fitness is enough. We walk on muddy trails with climbs and river crossings,
        sometimes for several hours. To reach the Cueva de los Tayos there is a 60-metre rope
        descent with local guides. If you have any limitations, let us know and we will find
        alternatives.
    - q: Is there electricity, phone signal and internet?
      a: >-
        The kitchen runs on solar power and you can charge your phone there. There's no wifi and no
        phone signal at the jea, but there is free wifi in the village, about a 35-minute walk away.
    - q: Which languages are spoken?
      a: >-
        In Maikiuants people speak Shuar Chicham and Spanish – hardly any other languages. During the
        tour, our international guide and translators accompany you, and we always find a way to
        understand each other.
    - q: Is it safe?
      a: >-
        The Maikiuants community is built on trust, and moving around inside the community is safe. On excursions and in the forest you are always with community members who know the region well.

