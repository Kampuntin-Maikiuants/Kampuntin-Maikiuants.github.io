# Contact page – English
hero:
  eyebrow: Contact
  title: Write to us
  lead: >-
    Questions about tours, volunteering or a research collaboration? Message us on WhatsApp or by email. We answer personally and usually within a day. Signal can be limited in the rainforest, so please be patient.
  image: "/assets/img/ilustraciones/detalle-4.jpg"
  image_alt: Illustration of Amazon rainforest plants
direct:
  whatsapp: WhatsApp
  whatsapp_cta: WhatsApp
  email: Email
  email_hint: "General email:"
  tips_title: To help us reply quickly, tell us
  tips:
    - whether you're interested in a tour, volunteering or something else,
    - the dates you have in mind,
    - how many people are coming,
    - and a little about yourself.
location:
  title: Where we are
  text: >-
    Maikiuants is located in the province of Morona Santiago in Ecuador's southern Amazon. The road
    to the community starts in Limón Indanza; from there it takes about two and a half hours,
    usually by taxi (approx. 50–60 USD). Tours start and end in Cuenca. We'll agree on the
    other travel details before your arrival.
    The road is not shown on Google Maps, but it is on OpenStreetMap.
  map_link: View on OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"

faq:
  title: Frequently asked questions
  items:
    - q: How long does it take you to reply?
      a: >-
        Usually within hours. Signal is limited in the rainforest, so sometimes it takes a little longer. WhatsApp is often faster.
    - q: Which languages can I write in?
      a: >-
        Spanish is best. If you don't speak Spanish, write to us anyway, we will translate your message.
    - q: How can I support you without travelling?
      a: >-
        By sharing our updates or helping with translation, photography or social media. With part
        of our income, Kampuntin already provides social support to families in the community for
        health, education and urgent needs. If you would like to support this work with a donation,
        please get in touch.
