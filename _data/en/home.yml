about:
  title: "Who we are"
  items:
    - title: "The Shuar"
      image: "/assets/img/fotos/shuar.jpg"
      image_alt: "Shuar families of Maikiuants in the forest"
      text: >-
        The Shuar are one of the largest Indigenous peoples of the Amazon, whose goal is to protect the rainforest. Their language is **Shuar Chicham**. Their life is deeply connected to the forest, the rivers and spirituality.
    - title: Maikiuants
      image: "/assets/img/fotos/maikiuants.jpg"
      image_position: bottom
      image_alt: "The centre of the Maikiuants community surrounded by rainforest"
      text: >-
        Maikiuants is a Shuar community in the province of Morona Santiago in Ecuador's southern Amazon, and part of the **Pueblo Shuar Arutam**. The village takes its name from the river that runs through it: *maikiua* is the guanto (angel's trumpet) that grows all along its banks, and *ants* means water. Maikiuants means "the water of the guanto".
    - title: Kampuntin
      image: "/assets/img/fotos/kampuntin.jpg"
      image_alt: "The Kampuntin team with a group of volunteers in front of the jea"
      text: >-
        *Kampuntin* means "rainforest" in Shuar Chicham – hence our motto **"Selva, mi destino"** (the rainforest, my destination). We were founded from within the Maikiuants community. We aim to create a cultural exchange, sharing a perspective of forest and community from within, while economically supporting the Maikiuants community. Kampuntin is also the organisation behind the scientific work, the monitoring and the protection of the rainforest.


# PLACEHOLDER – the mission will be worded in more detail later
mission:
  title: Kampuntin's mission
  intro: |-
    The Community Tourism Services Organization KAMPUNTIN, Selva Mi Destino, aims to preserve the culture, customs and ancestral wisdom of the Shuar people, promoting a cultural exchange based on respect, identity and nature.

    Our principles are based on protecting the Amazon, conserving the rainforest, passing knowledge on to the new generations and to the world, and strengthening a sustainable economy that benefits the families of the Maikiuants community.

    At Kampuntin, it is not only about tourism. It is about sharing our identity, defending our territory and building a future with dignity, culture and harmony with nature.

    **KAMPUNTIN – SELVA MI DESTINO**<br>Economic development with identity, respect for nature and pride in being Shuar.
  items:
    - title: Care for and monitor the rainforest
      text: >-
        We care for and monitor the forest, rivers and animals of our territory, so that future
        generations can live from them and with them, too.
    - title: Share and document Shuar culture
      text: >-
        We pass on our language, knowledge and customs to visitors and to the next generations.
    - title: Learn together
      text: >-
        Visitors, volunteers and community learn from each other — about plants, food, spirituality and other ways of living.
    - title: Strengthen the community
      text: >-
        We pay local guides and cooks, buy food within the community, and 5% of the income goes directly to Maikiuants.
quote:
  text: Iikia kampuntniuitji tura achitkiaji ii nekatairijiai.
  translation: "We are nature, connection and wisdom."
  source: ""


location:
  title: Where we are
  text: >-
    Maikiuants is located in the province of **Morona Santiago** in Ecuador's southern Amazon, in
    the Cordillera del Cóndor. The road to Maikiuants starts in **Limón Indanza**; from there it
    takes about two and a half hours, usually by taxi (approx. 50–60 USD). Tours start in
    Cuenca and from there we travel together to the community.
    The road is not shown on Google Maps, but it is on OpenStreetMap.
  coords: 3°07'10.2" S · 78°15'56.4" W
  map_link: View on OpenStreetMap
  map_url: "https://www.openstreetmap.org/?mlat=-3.119508&mlon=-78.265679#map=12/-3.11951/-78.26568"
  labels:
    title: Map of Ecuador showing the location of Maikiuants in the southern Amazon
    peru: Peru
    ocean: Pacific Ocean
  region:
    title: "Detailed map: the road from Limón Indanza to Maikiuants"

explore:
  title: Discover Maikiuants
  intro: Choose where to start.
  items:
    - ref: tours
      title: Tours
      text: 22 days in Shuar territory for groups of up to 12 people, with about ten days sharing community life.
    - ref: volunteering
      title: Volunteering
      text: Gardening, agroforestry, mingas and construction, living in a traditional jea in the forest.
    - ref: science
      title: Science
      text: Community para-ecologists monitor biodiversity, rivers and the climate.

