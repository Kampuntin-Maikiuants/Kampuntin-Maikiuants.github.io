# Science page (para-ecology) – English

hero:
  eyebrow: Science
  title: "Para-ecology: researching the forest from within the community"
  lead: >-
    In Maikiuants, community members train as para-ecologists. They combine Shuar knowledge
    of the forest with scientific methods to document biodiversity and protect their
    territory.
  image: "/assets/img/fotos/hero-ciencia.jpg"
  image_alt: Para-ecologists from Maikiuants working with microscopes

what:
  title: What is a para-ecologist?
  image: "/assets/img/fotos/paraecologos.jpg"
  image_alt: The para-ecologist team by the river
  text: |-
    A para-ecologist is a community member trained in ecological monitoring methods. They have
    known the forest and its particularities since childhood, and learn to record their
    observations systematically, so they can be compared over the years and shared with
    researchers.

    This way, knowledge stays in the community, and the data help to make decisions about the
    territory: where to build new homes, which areas to protect, and how the river and the forest
    are changing with climate change. The aim is to defend the territory, not just the forest.
  quote:
    text: >-
      We are people who come to the aid of all the biodiversity in our territory – to know it,
      value it and respect it – and we raise environmental awareness so that future generations
      keep caring for it. Being a para-ecologist means coming to the aid of every species that is
      in danger of extinction.
    author: Freddy Ankuash, para-ecologist, manager and coordinator of Kampuntin

methods:
  title: What we monitor
  intro: >-
    In addition to the existing weather
    station and wildlife cameras, a new scientific station will soon be built so that we can
    collect and analyse data even more systematically.
  items:
    - title: Camera traps
      text: >-
        Automatic cameras have been placed in the territory of threatened animals to observe their
        behaviour, their activity patterns and, where possible, their reproduction.
    - title: Exploration walks
      text: >-
        On every walk we check everything at once: bird calls, amphibians, mammals and other forest indicators,
        seed trees, flowering and fruiting – linked to the plant nursery and agroforestry.
    - title: Water quality
      text: >-
        We regularly measure rivers and streams: pH value, temperature, turbidity and aquatic
        macroinvertebrates, which react very quickly to any pollution.
    - title: Weather station
      text: >-
        Our weather station records temperature, humidity, rainfall and wind, so we can document
        how the climate in the territory is changing.
    - title: Shuar life
      text: >-
        We document Shuar life and knowledge: we take photos, record the Shuar Chicham language and
        note down names, uses and stories about plants and animals.
    - title: New scientific station
      text: >-
        Coming soon: a dedicated station to store, process and analyse monitoring data right here
        in Maikiuants.

