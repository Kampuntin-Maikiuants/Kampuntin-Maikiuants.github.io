animals:
  title: Our animal neighbours
  intro: >-
    The forest and rivers of Maikiuants are home to countless animals. Some are threatened,
    some are new to science, and many live hidden under water.

  threatened:
    title: Threatened species
    intro: >-
      Maikiuants is an area of great importance for biodiversity. The harmonious relationship
      between the Shuar community and nature allows mammals that are threatened worldwide to live
      in its territory. Among others, the 2024 camera traps recorded:
    note: Threat categories according to our information board.
    also: "Also recorded: margay, tayra, ocelot, Amazon squirrel and spectral bat, among others."
    sensitive: To protect them, we never publish exact locations of sensitive species.

  atelopus:
    title: "A very special frog: Atelopus sp."
    name: Atelopus sp.
    images:
      - { image: /assets/img/fotos/atelopus.jpg, alt: Yellow and black Atelopus frog on moss }
      - { image: /assets/img/fotos/atelopus-2.jpg, alt: Atelopus frog among leaves }
    text: |-
      All species of the genus *Atelopus* are threatened. The *Atelopus sp.* frog is endangered,
      mainly due to the loss of its natural habitat. Maikiuants is one of the few places in the
      world where it can still be seen.

      Its survival depends on a balanced ecosystem with healthy forests and clean water. It is so
      sensitive to changes in its environment and so hard to find that it is still in the process
      of being scientifically described.

  frog:
    title: A species new to science?
    name: Family Bufonidae – species not yet identified
    images:
      - { image: /assets/img/fotos/rana-nueva.jpg, alt: The Maikiuants frog that could be a new species }
      - { image: /assets/img/fotos/rana-nueva-2.jpg, alt: The frog in a sampling bag during monitoring }
    text: |-
      On **19 June 2024**, the para-ecologists discovered a frog that has not yet been identified.
      The photos suggest it could belong to the family *Bufonidae*. However, its unusual features
      raise the possibility that it could be a **completely new species**.

  river:
    title: "Life under water: the animals of our rivers"
    image: /assets/img/libro/collage.jpg
    image_alt: Aquatic macroinvertebrates from our rivers (photos from the book)
    text: |-
      The water of the Yunkumas and Akaas rivers is in excellent condition because the forest is
      intact – we measure a pH of 7.8. The rivers are home to small aquatic animals (insect larvae,
      snails, crabs and shrimps) that hardly anyone ever sees. The para-ecologists collect,
      identify and photograph them; the photos below are from our book.

      Because they react quickly to pollution, they help us understand water quality and detect
      any change straight away – for example in nearby rivers affected by mining.
    groups:          # Fotos aus dem Buch
      - { name: "Mayfly", latin: Euthyplociidae, image: /assets/img/libro/euthyplociidae.jpg }
      - { name: "Damselfly (larva)", latin: Polythoridae, image: /assets/img/libro/polythoridae.jpg }
      - { name: "Water penny", latin: Psephenidae, image: /assets/img/libro/psephenidae.jpg }
      - { name: "Riffle beetle (larva)", latin: Elmidae, image: /assets/img/libro/elmidae.jpg }
      - { name: "Long-toed water beetle", latin: Dryopidae, image: /assets/img/libro/dryopidae.jpg }
      - { name: "Rove beetle", latin: Staphylinidae, image: /assets/img/libro/staphylinidae.jpg }
      - { name: "Net-winged midge (larva)", latin: Blephariceridae, image: /assets/img/libro/blephariceridae.jpg }
      - { name: "Black fly (larva)", latin: Simuliidae, image: /assets/img/libro/simuliidae.jpg }
      - { name: "Leech", latin: Glossiphoniidae, image: /assets/img/libro/glossiphoniidae.jpg }
      - { name: "Aquatic worm", latin: Oligochaeta, image: /assets/img/libro/oligochaeta.jpg }

