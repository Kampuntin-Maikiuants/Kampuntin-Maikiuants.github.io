faq:
  title: Frequently asked questions
  items:
    - q: How long can I stay?
      a: >-
        Ideally at least one month, but we're flexible: two or three weeks can also be arranged.
        There's no maximum – you can stay for months or even years; a friend of ours has been living
        here for five years.
    - q: How much does volunteering cost?
      a: >-
        Accommodation in the jea is in exchange for your work. You bring food and cook together
        (see "Practical information"); also plan some money for small purchases and the taxi from
        Limón Indanza.
    - q: Do I need experience in farming or construction?
      a: >-
        No. What matters is the willingness to learn and to work. We'll teach you everything
        you need on site.
    - q: Do I need to speak Spanish?
      a: >-
        Basic Spanish helps a lot when living with the community. [State whether someone on the
        team speaks English.]
    - q: What does a typical day look like?
      a: >-
        In the morning, when it's cooler, we work in the nursery, the plots or on construction.
        After a shared lunch, afternoons are usually free: river, walks, crafts or time with the
        children.
    - q: Is there internet and electricity?
      a: >-
        A solar panel powers the kitchen, and you can charge your phone there too. There's no phone
        signal, but internet is available at the community centre, about a 20–25-minute walk away.
    - q: Which vaccinations and insurance do I need?
      a: >-
        Travel insurance with medical cover is required. Talk to a travel doctor; for the Amazon,
        the yellow fever vaccination is usually recommended.
    - q: Can I come with my partner or friends?
      a: >-
        Yes, just write to us early. The lodge has room for 12 people; we have already hosted 6 or 7
        volunteers at the same time.
