# Volunteering page – English (based on the WWOOF profile)
# Text in [square brackets] is a placeholder: replace with the real information.

hero:
  eyebrow: Volunteering
  title: Volunteering in Maikiuants
  lead: >-
    Join us in Maikiuants to work, learn and live together.
  image: "/assets/img/fotos/hero-voluntariado.jpg"
  image_alt: Volunteers with machetes next to a member of the community

who:
  title: "We are looking for people who would like to…"
  items:
    - learn about plants, agroforestry and permaculture
    - live in a group and share the tasks
    - get to know Shuar culture and life in the rainforest
    - spend a lot of time outdoors
    - enjoy a slow, calm and flexible day-to-day life
    - be open-minded, respectful and flexible


tasks:
  title: "How you'll help"
  intro: >-
    We invite you to assist wherever help is needed and to bring in your own ideas and skills. Some of the tasks you could help with:
  items:
    - title: "Garden and nursery"
      text: "Nursery, sowing and care of the garden and the land around the house."
    - title: "Agroforestry"
      text: "Looking after the agroforestry crops with weeding, pruning and harvesting."
    - title: "Construction"
      text: "Support with construction work and improvements to the infrastructure."
    - title: "Minga"
      text: "Community work days in the village of Maikiuants."
    - title: "Your skills"
      text: "Bring in your own skills, for example sewing, social media or videos. You can also help with your language, with translations or by teaching languages. Every impulse is welcome."


life:
  title: Life in the jea
  text: |-
    We sleep in a traditional house called a **jea**, in the middle of the jungle. There are
    three-level bunk beds and the possibility of hanging a hammock. The shower is the best
    in the world: a pure river with fresh water.

    A well-equipped kitchen is available for cooking. A solar panel supplies it with
    electricity, and there is a blender and a juice extractor. In the future, we plan to install
    a small fridge for food storage. Meals are usually shared with the other volunteers.
  # The 6 photos are in _data/jea_photos.yml (shared with the tours page)

free_time:
  title: Free time
  text: >-
    In your free time, you can make the most of the area: we can take you on beautiful walks,
    you can play with the children, take part in pottery-making, make crafts, play music and sing. You can also use your free time to learn, read and meditate.
  quote: It's a place of creativity and freedom where anything is possible.

practical:
  title: Practical information
  items:
    - { label: Length of stay, value: "At least one month (shorter stays of 2–3 weeks can be arranged) – no upper limit" }
    - { label: Working hours, value: "Flexible, 3–5 h a day, 5 days a week" }
    - label: Food
      value: >-
        Bring food for at least the first week, to cook together with the 2–3 community members
        you live with. Bananas and plantains grow here, and a small shop in the community sells
        basics. Also bring extra cash for shopping and the taxi from Limón Indanza that will bring your food. There's a
        solution for everything, and people are always happy to help.
    - { label: Languages, value: "Spanish and Shuar Chicham – hardly any other languages. Basic Spanish helps a lot" }
    - { label: Arrival, value: "By bus to Limón Indanza, then about 2 h 30 by taxi (approx. 60–70 USD) to the community" }
  wwoof: Find us on WWOOF too

apply:
  title: How to apply
  steps:
    - title: Introduce yourself
      text: Tell us who you are, what motivates you and when you would like to come.
    - title: Confirmation
      text: We agree on dates and further details.
    - title: Welcome!
      text: We meet you at the accommodation and show you around.
  button: I want to volunteer

# Erfahrungsberichte (nur mit Einverständnis der Personen veröffentlichen)
testimonials:
  title: Volunteer experiences
  intro: What people who have already spent time in Maikiuants say.
  # quote = short quote (always visible) · text = full story to expand (optional, any length)
  items:
    - quote: >-
        What I particularly enjoyed was that not everything followed a fixed schedule – the day was allowed to unfold naturally.
      name: "Yael"
      meta: "Volunteer · October 2026"
      photo: ""
      text: |-
        My time in Maikiuants was shaped by the slow, relaxed pace of life. What I particularly enjoyed was that not everything followed a fixed schedule. Instead, each day was allowed to unfold naturally, depending on how people felt, the weather and the tasks that needed doing.

        After just a few days, the 30-minute walk to the community no longer bothered me, and we were often given a ride on a motorbike, which made the journey even more fun. The people in the community were incredibly welcoming, open and helpful. They showed me so many wonderful and interesting things, and I learned a great deal.

        We were given lots of yuca, plantains and sweet bananas, and we were allowed to help with the harvest. Two members of the community spent the days with us and gradually showed us around: the forest, the community and the neighbouring communities. We quickly felt at home.

        I also had a lot of freedom in my work. I could largely choose what I wanted to do and organise my tasks flexibly, so the work felt less like an obligation and more like a hobby I genuinely enjoyed.

        My time in the community and at the jea was very valuable to me. I gained many new experiences, met interesting people and learned things that I will carry with me long after my stay has ended.
    - quote: >-
        If you are open to a simple, natural way of life and to cultural exchange, and you like the unexpected, you will definitely have a good experience.
      name: "Lotte"
      meta: "Volunteer · August 2025"
      photo: ""
      text: |-
        A few months ago we spent a month with the Shuar. It is a time I remember very fondly and an experience that was truly valuable. A 20-minute walk from the village where the Shuar live, we slept in a traditional house near the river, surrounded by beautiful, fascinating nature and the wonderful sounds of the rainforest.

        Every morning we walked to the village to help with the agroforestry project. We learned a lot about plants and how to plant them, about ecological relationships and local challenges. Daily routines were relaxed, and sometimes we went deep into the rainforest to the waterfalls to learn about traditions and get an idea of the Shuar's vast knowledge of the forest. I think what volunteers do there is probably always different and may be something other than what we did. Either way, we recommend staying at least 3 weeks to build a connection with the family, the children and the other people. Everything takes its time…

        Many fantastic experiences are left unmentioned here, but if you are open to a simple, natural way of life and to cultural exchange, and you like the unexpected, you will definitely have a good experience.

        Greetings to Nancy and Pinchu, Estrella, Kilian and Kirup, to Freddy, Numi and Julien!

        Dino and Lotz

faq:
  title: Frequently asked questions
  items:
    - q: How much does volunteering cost?
      a: >-
        Accommodation in the jea is in exchange for your work. Please bring some money for the taxi
        from Limón Indanza and to buy your food (see "Practical information").
    - q: Do I need experience in farming or construction?
      a: >-
        No. What matters is the willingness to learn and to work. We'll teach you everything
        you need on site.
    - q: Do I need to speak Spanish?
      a: >-
        Hardly anyone in the community speaks English, so basic Spanish helps a lot when living together.
    - q: What does a typical day look like?
      a: >-
        Every day is different. There's often no fixed plan and many things happen spontaneously.
        You're welcome to bring your own wishes and ideas, and together we see what's possible.
    - q: Is there internet and electricity?
      a: >-
        The kitchen runs on solar power and you can charge your phone there. There's no wifi and no
        phone signal at the house where you live, but you can walk about 35 minutes to the village
        and use the free wifi there.
    - q: Which vaccinations and insurance do I need?
      a: >-
        Travel insurance with medical cover is required. Talk to a travel doctor; for the Amazon,
        vaccinations against yellow fever, typhoid, hepatitis A and B and rabies are usually very
        important.
    - q: Can I come with my partner, family or friends?
      a: >-
        Yes, just write to us early. The lodge has room for 12 people.
