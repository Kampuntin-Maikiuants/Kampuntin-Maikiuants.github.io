# Volunteering page – English (based on the WWOOF profile)
# Text in [square brackets] is a placeholder: replace with the real information.

hero:
  eyebrow: Volunteering
  title: Volunteering in Maikiuants
  lead: >-
    Join us in Maikiuants to work, learn and live together.
  image: "/assets/img/fotos/hero-voluntariado.jpg"
  image_alt: Volunteers with machetes next to a member of the community

who:
  title: "We are looking for people who would like to…"
  items:
    - learn about plants, agroforestry and permaculture
    - live in a group and share the tasks
    - get to know Shuar culture and life in the rainforest
    - spend a lot of time outdoors
    - enjoy a slow, calm and flexible day-to-day life
    - be open-minded, respectful and flexible


tasks:
  title: "How you'll help"
  intro: >-
    We invite you to assist wherever help is needed and to bring in your own ideas and skills. Some of the tasks you could help with:
  items:
    - title: "Garden and nursery"
      text: "Nursery, sowing and care of the garden and the land around the house."
    - title: "Agroforestry"
      text: "Looking after the agroforestry crops with weeding, pruning and harvesting."
    - title: "Construction"
      text: "Support with construction work and improvements to the infrastructure."
    - title: "Minga"
      text: "Community work days in the village of Maikiuants."
    - title: "Your skills"
      text: "Bring in your own skills, for example sewing, social media or videos. You can also help with your language, with translations or by teaching languages. Every impulse is welcome."


life:
  title: Life in the jea
  text: |-
    We sleep in a traditional house called a **jea**, in the middle of the jungle. There are
    bunk beds on three levels and the possibility of hanging a hammock. The shower is the best
    in the world: a pure river with fresh water.

    A well-equipped kitchen is available for cooking. A solar panel supplies it with
    electricity, and there is a blender and a juice extractor. In the future, we plan to install
    a small fridge for food storage. Meals are usually shared with the other volunteers.
  # The 6 photos are in _data/jea_photos.yml (shared with the tours page)

free_time:
  title: Free time
  text: >-
    In your free time, you can make the most of the area: we can take you on beautiful walks,
    you can play with the children, take part in pottery-making, make crafts, play music and sing. You can also use your free time to learn, read and meditate.
  quote: It's a place of creativity and freedom where anything is possible.

practical:
  title: Practical information
  items:
    - { label: Length of stay, value: "At least one month (shorter stays of 2–3 weeks can be arranged) – no upper limit" }
    - { label: Working hours, value: "Flexible, 3–5 h a day, 5 days a week" }
    - label: Food
      value: >-
        Bring food for at least the first week, to cook together with the 2–3 community members
        you live with. Bananas and plantains grow here, and a small shop in the community sells
        basics. Also bring extra cash for shopping and the taxi from Limón Indanza. There's a
        solution for everything, and people are always happy to help.
    - { label: Languages, value: "Spanish and Shuar Chicham – hardly any other languages. Basic Spanish helps a lot" }
    - { label: Arrival, value: "By bus to Limón Indanza, then about 2 h 30 by taxi (approx. 60–70 USD) to the community" }
  wwoof: Find us on WWOOF too

apply:
  title: How to apply
  steps:
    - title: Introduce yourself
      text: Tell us who you are, what motivates you and when you would like to come.
    - title: Confirmation
      text: We agree on dates and further details.
    - title: Welcome!
      text: We meet you at the accommodation and show you around.
  button: I want to volunteer

