faq:
  title: Frequently asked questions
  items:
    - q: How much does volunteering cost?
      a: >-
        Accommodation in the jea is in exchange for your work. Please bring some money for the taxi
        from Limón Indanza and to buy your food (see "Practical information").
    - q: Do I need experience in farming or construction?
      a: >-
        No. What matters is the willingness to learn and to work. We'll teach you everything
        you need on site.
    - q: Do I need to speak Spanish?
      a: >-
        Hardly anyone in the community speaks English, so basic Spanish helps a lot when living together.
    - q: What does a typical day look like?
      a: >-
        Every day is different. There's often no fixed plan and many things happen spontaneously.
        You're welcome to bring your own wishes and ideas, and together we see what's possible.
    - q: Is there internet and electricity?
      a: >-
        The kitchen runs on solar power and you can charge your phone there. There's no wifi and no
        phone signal at the house where you live, but you can walk about 35 minutes to the village
        and use the free wifi there.
    - q: Which vaccinations and insurance do I need?
      a: >-
        Travel insurance with medical cover is required. Talk to a travel doctor; for the Amazon,
        vaccinations against yellow fever, typhoid, hepatitis A and B and rabies are usually very
        important.
    - q: Can I come with my partner, family or friends?
      a: >-
        Yes, just write to us early. The lodge has room for 12 people.
