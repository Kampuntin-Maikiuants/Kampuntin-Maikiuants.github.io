# Jedes Album ist ein Ordner in assets/galeria/, z. B. assets/galeria/2026-09-tour-septiembre/
# Fotos einfach in den Ordner hochladen – das Album erscheint automatisch (neueste Ordnernamen zuerst,
# deshalb Ordnernamen mit Datum beginnen).
#
# Hier optional Titel, Datum und Titelbild festlegen:
#   folder: Ordnername
#   title:  Titel auf Spanisch, Englisch und Französisch
#   date:   Datum (für die Anzeige „Octubre 2026“)
#   cover:  Dateiname des Titelbilds (leer = erstes Foto im Ordner)
# Ordner ohne Eintrag erscheinen trotzdem, mit dem Ordnernamen als Titel.

