# =============================================================
#  Maikiuants · Kampuntin – Website-Einstellungen
#  Nach Änderungen an dieser Datei baut GitHub Pages die Seite neu
#  (dauert ca. 1–2 Minuten).
# =============================================================

title: "Kampuntin Maikiuants"
# Vollständiger Name der Organisation (erscheint in der Fußzeile)
org_name: "Organización Comunitaria de Servicios Turísticos Kampuntin (Selva mi destino)"
description: "Tours, voluntariado y ciencia comunitaria con la comunidad shuar de Maikiuants, Amazonía ecuatoriana."

# Adresse der Website. GitHub Pages setzt url/baseurl automatisch.
# Nur ausfüllen, wenn eine eigene Domain genutzt wird, z. B.:
# url: "https://www.kampuntin.org"
# baseurl: ""

# Bild für Vorschauen in WhatsApp/Facebook (1200×630 px empfohlen)
og_image: "/assets/img/fotos/og.jpg"

# --- Kontakt -------------------------------------------------
contact:
  email: "ocstkampuntin@gmail.com"
  whatsapp: "593980154335"         # Haupt-WhatsApp für die Buttons (ohne + und Leerzeichen)
  # Ansprechpersonen (wie auf dem Flyer) – erscheinen auf der Kontaktseite und in der Fußzeile
  people:
    - name: Julien Shakaim
      role: { es: Contacto para visitantes internacionales, en: Contact for international visitors, fr: Contact pour les visiteurs internationaux }
      whatsapp: "32494860865"
      phone: "+32 494 86 08 65"
      email: "jdefourny.explore@gmail.com"
    - name: Freddy Ankuash
      role: { es: Coordinación de tours y voluntariado, en: Tour and volunteer coordination, fr: Coordination des tours et du bénévolat }
      whatsapp: "593980154335"
      phone: "+593 98 015 4335"

# --- Soziale Netzwerke (leer lassen = wird nicht angezeigt) --
social:
  instagram:
    handle: territorioshuar
    url: "https://www.instagram.com/territorioshuar/"
  facebook:                                 # eine oder mehrere Facebook-Seiten
    - name: Kampuntin
      url: "https://www.facebook.com/profile.php?id=61576137841827"
    - name: Maikiuants
      url: "https://www.facebook.com/profile.php?id=61566774571229"
  wwoof: "https://wwoofindependents.org/en/host/56512"   # WWOOF-Profil

# Illustration als schwaches Muster im Hintergrund der ganzen Seite (true = an, false = aus)
# Wer die Website pflegt (Abschnitt „Las caras detrás de esta web“, Impressum)
webmaster:
  name: Jesko Dorner
  email: jesko.dorner@gmail.com

# Besucherstatistik mit GoatCounter (kostenlos, ohne Cookies): Kontonamen eintragen,
# z. B. goatcounter: "kampuntin" für https://kampuntin.goatcounter.com – leer = aus.
goatcounter: "jeskodor"

# Versionsnummer für Fotos: nach dem Austausch von Bildern (gleicher Dateiname) um 1 erhöhen,
# damit Browser nicht die alte, zwischengespeicherte Fassung zeigen.
image_version: 8

background_pattern: true

# Kleines Fenster auf der Startseite, das den nächsten Tour-Termin bewirbt (true = an, false = aus).
# Zeigt automatisch den nächsten Termin aus _data/tour_dates.yml, der noch freie Plätze hat.
tour_popup: true

# Eingebettete Facebook-Chronik (erst nach Klick). Ausgeschaltet, weil Facebook sie nur noch
# eingeloggten Besuchern zeigt – alle anderen sehen ein leeres Feld. Die Beiträge kommen
# stattdessen über den automatischen Import (README, Abschnitt 3).
facebook_timeline: false

# =============================================================
#  Ab hier: technische Einstellungen – normalerweise nicht ändern
# =============================================================
lang: es
# Sprachen der Website (Reihenfolge im Sprachumschalter)
languages: [es, en, fr]
timezone: America/Guayaquil

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - TODO.md
  - GEGENLESEN.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .pages.yml
  - node_modules
