# Konfiguration für Pages CMS (https://app.pagescms.org) – einfacher Editor für Termine, Fotos und Texte.
#
# WICHTIG beim Ändern dieser Datei:
# - Pages CMS speichert nur Felder, die hier definiert sind. „merge: true“ sorgt dafür, dass andere Teile
#   einer Datei erhalten bleiben. Listen (Team, Alben, Termine, Erfahrungsberichte) werden aber komplett
#   neu geschrieben: Jedes Feld, das in diesen Daten vorkommt, muss hier stehen, sonst geht es verloren.
# - Kommentare in Dateien, die über Pages CMS gespeichert werden, gehen verloren (Inhalt bleibt).
# - Bei Dateien, die als Ganzes eine Liste sind (Alben, Team), muss es „list: true“ bleiben:
#   „list: { collapsible: … }“ funktioniert dort nicht (leeres Formular statt Liste!).

settings:
  content:
    merge: true

media:
  - name: galeria
    label: Galería (álbumes de fotos)
    input: assets/galeria
    output: /assets/galeria
    extensions: [jpg, jpeg, png, webp]
  - name: fotos_equipo
    label: Fotos del equipo
    input: assets/img/equipo
    output: /assets/img/equipo
    extensions: [jpg, jpeg, png, webp]
  - name: fotos
    label: Otras fotos de la página
    input: assets/img/fotos
    output: /assets/img/fotos
    extensions: [jpg, jpeg, png, webp]
  - name: camaras
    label: Fotos de las cámaras trampa
    input: assets/img/camaras
    output: /assets/img/camaras
    extensions: [jpg, jpeg, png, webp]
  - name: especies
    label: Ilustraciones de especies
    input: assets/img/especies
    output: /assets/img/especies
    extensions: [jpg, jpeg, png, webp]

content:
  - name: tour_dates
    label: Fechas de tours
    type: file
    path: _data/tour_dates.yml
    format: yaml
    fields:
      - name: dates
        label: Fechas
        type: object
        list:
          collapsible: { summary: "{trip} · {label.es}" }
        fields:
          - { name: start, label: Inicio, type: date, options: { format: yyyy-MM-dd } }
          - { name: end, label: Fin, type: date, options: { format: yyyy-MM-dd } }
          - name: trip
            label: Viaje
            type: select
            options:
              values:
                - { name: espiritual, label: Viaje espiritual (8 días) }
                - { name: arutam, label: Viaje Arutam (10 días) }
          - name: label
            label: Texto en vez de la fecha (opcional, si la fecha exacta aún no está fija)
            type: object
            fields:
              - { name: es, label: Español, type: string }
              - { name: en, label: English, type: string }
              - { name: fr, label: Français, type: string }
          - name: note
            label: Nota pequeña debajo de la fecha (opcional, p. ej. «Fecha exacta por confirmar»)
            type: object
            fields:
              - { name: es, label: Español, type: string }
              - { name: en, label: English, type: string }
              - { name: fr, label: Français, type: string }
          - name: free
            label: Plazas libres (número; 0 = completo). Dejar vacío para usar el estado de abajo
            type: number
          - name: status
            label: Estado (solo si "Plazas libres" está vacío)
            type: select
            options:
              values:
                - { name: request, label: Plazas a consultar }
                - { name: open, label: Plazas libres }
                - { name: few, label: Últimas plazas }
                - { name: full, label: Completo }

  - name: precios_aviso
    label: Precios y aviso
    description: Vale para los tres idiomas.
    type: file
    path: _data/tour_settings.yml
    format: yaml
    fields:
      - { name: popup, label: "Mostrar el aviso (pop-up) en la página de inicio", type: boolean }
      - name: espiritual
        label: "Precio del viaje espiritual"
        type: object
        fields:
          - { name: show, label: "Mostrar el precio (apagado = «Precio a consultar»)", type: boolean }
          - { name: amount, label: "Precio por persona, igual para los tres idiomas (por ejemplo 1200 USD)", type: string }
      - name: arutam
        label: "Precio del viaje Arutam"
        type: object
        fields:
          - { name: show, label: "Mostrar el precio (apagado = «Precio a consultar»)", type: boolean }
          - { name: amount, label: "Precio por persona, igual para los tres idiomas (por ejemplo 1200 USD)", type: string }

  - name: viajes
    label: Viajes
    type: group
    items:
      - name: viajes_es
        label: Español
        type: file
        path: _data/es/tours.yml
        format: yaml
        fields:
          - name: trips
            label: Viajes
            type: object
            fields:
              - name: espiritual
                label: Viaje espiritual
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }
              - name: arutam
                label: Viaje Arutam
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }
      - name: viajes_en
        label: English
        type: file
        path: _data/en/tours.yml
        format: yaml
        fields:
          - name: trips
            label: Viajes
            type: object
            fields:
              - name: espiritual
                label: Viaje espiritual
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }
              - name: arutam
                label: Viaje Arutam
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }
      - name: viajes_fr
        label: Français
        type: file
        path: _data/fr/tours.yml
        format: yaml
        fields:
          - name: trips
            label: Viajes
            type: object
            fields:
              - name: espiritual
                label: Viaje espiritual
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }
              - name: arutam
                label: Viaje Arutam
                type: object
                fields:
                  - { name: name, label: Nombre, type: string }
                  - { name: days, label: "Duración (por ejemplo 8 días)", type: string }
                  - { name: when, label: "Temporada (por ejemplo Abril – mayo 2027)", type: string }
                  - { name: text, label: Descripción corta, type: text }
                  - { name: link, label: "Texto del enlace al programa", type: string }

  - name: aviso
    label: Aviso (pop-up)
    type: group
    items:
      - name: aviso_es
        label: Español
        type: file
        path: _data/es/home.yml
        format: yaml
        fields:
          - name: tour_popup
            label: Aviso (pop-up)
            type: object
            fields:
              - { name: eyebrow, label: "Línea pequeña arriba (por ejemplo Próximo tour)", type: string }
              - { name: text, label: Texto, type: text }
              - { name: button, label: Texto del botón, type: string }
              - name: image
                label: Foto del aviso
                type: image
                options: { media: fotos }
              - { name: per, label: "Texto después del precio (por ejemplo por persona)", type: string }
              - { name: close, label: "Texto del botón para cerrar (lo leen los lectores de pantalla)", type: string }
      - name: aviso_en
        label: English
        type: file
        path: _data/en/home.yml
        format: yaml
        fields:
          - name: tour_popup
            label: Aviso (pop-up)
            type: object
            fields:
              - { name: eyebrow, label: "Línea pequeña arriba (por ejemplo Próximo tour)", type: string }
              - { name: text, label: Texto, type: text }
              - { name: button, label: Texto del botón, type: string }
              - name: image
                label: Foto del aviso
                type: image
                options: { media: fotos }
              - { name: per, label: "Texto después del precio (por ejemplo por persona)", type: string }
              - { name: close, label: "Texto del botón para cerrar (lo leen los lectores de pantalla)", type: string }
      - name: aviso_fr
        label: Français
        type: file
        path: _data/fr/home.yml
        format: yaml
        fields:
          - name: tour_popup
            label: Aviso (pop-up)
            type: object
            fields:
              - { name: eyebrow, label: "Línea pequeña arriba (por ejemplo Próximo tour)", type: string }
              - { name: text, label: Texto, type: text }
              - { name: button, label: Texto del botón, type: string }
              - name: image
                label: Foto del aviso
                type: image
                options: { media: fotos }
              - { name: per, label: "Texto después del precio (por ejemplo por persona)", type: string }
              - { name: close, label: "Texto del botón para cerrar (lo leen los lectores de pantalla)", type: string }

  - name: albumes
    label: Álbumes de fotos
    description: Las fotos se suben en «Galería»; aquí se ponen el título y la portada. El orden de esta lista es el orden en la galería (arrastra para cambiarlo).
    type: file
    path: _data/albums.yml
    format: yaml
    list: true
    fields:
      - name: folder
        label: "Carpeta del álbum en «Galería» (el nombre exacto, por ejemplo fiesta-de-la-chonta-2027)"
        type: string
        required: true
      - name: title
        label: "Título"
        type: object
        fields:
          - { name: es, label: Español, type: string }
          - { name: en, label: English, type: string }
          - { name: fr, label: Français, type: string }
      - name: cover
        label: "Portada: nombre del archivo, por ejemplo 005.jpg (vacío = la primera foto)"
        type: string

  - name: equipo
    label: Equipo
    type: file
    path: _data/team.yml
    format: yaml
    list: true
    fields:
      - { name: name, label: Nombre, type: string, required: true }
      - { name: shuar_name, label: "Nombre shuar (opcional)", type: string }
      - name: group
        label: Grupo
        type: select
        options:
          values:
            - { name: kampuntin, label: "Kampuntin: equipo en Maikiuants" }
            - { name: community, label: Comunidad }
      - name: photo
        label: "Foto (cuadrada, unos 600 × 600 píxeles, la cara en el centro)"
        type: image
        options: { media: fotos_equipo }
      - name: contact
        label: "Mostrar el enlace «Escríbenos» (solo personas de contacto)"
        type: boolean
      - name: role
        label: "Función"
        type: object
        fields:
          - { name: es, label: Español, type: string }
          - { name: en, label: English, type: string }
          - { name: fr, label: Français, type: string }
      - name: bio
        label: "Texto corto"
        type: object
        fields:
          - { name: es, label: Español, type: text }
          - { name: en, label: English, type: text }
          - { name: fr, label: Français, type: text }
      - name: details
        label: "Texto largo (opcional; si existe, se muestra en lugar del texto corto)"
        type: object
        fields:
          - { name: es, label: Español, type: text }
          - { name: en, label: English, type: text }
          - { name: fr, label: Français, type: text }
      - name: social
        label: "Enlaces (Instagram, Facebook …)"
        type: object
        list:
          collapsible: { summary: "{name}" }
        fields:
          - { name: name, label: "Texto del enlace (por ejemplo Instagram)", type: string }
          - { name: handle, label: "Nombre de usuario (opcional)", type: string }
          - { name: url, label: Enlace, type: string }

  - name: experiencias
    label: Experiencias de voluntarios
    type: group
    items:
      - name: experiencias_es
        label: Español
        type: file
        path: _data/es/volunteering.yml
        format: yaml
        fields:
          - name: testimonials
            label: Experiencias
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - { name: intro, label: Introducción, type: string }
              - name: items
                label: Experiencias
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{name} · {meta}" }
                fields:
                  - { name: quote, label: "Cita corta (siempre visible)", type: text }
                  - { name: name, label: Nombre, type: string }
                  - { name: meta, label: "Línea pequeña (por ejemplo «Voluntariado · octubre de 2026»)", type: string }
                  - name: photo
                    label: "Foto (opcional)"
                    type: image
                    options: { media: fotos }
                  - { name: text, label: "Relato completo (opcional)", type: text }
      - name: experiencias_en
        label: English
        type: file
        path: _data/en/volunteering.yml
        format: yaml
        fields:
          - name: testimonials
            label: Experiencias
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - { name: intro, label: Introducción, type: string }
              - name: items
                label: Experiencias
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{name} · {meta}" }
                fields:
                  - { name: quote, label: "Cita corta (siempre visible)", type: text }
                  - { name: name, label: Nombre, type: string }
                  - { name: meta, label: "Línea pequeña (por ejemplo «Voluntariado · octubre de 2026»)", type: string }
                  - name: photo
                    label: "Foto (opcional)"
                    type: image
                    options: { media: fotos }
                  - { name: text, label: "Relato completo (opcional)", type: text }
      - name: experiencias_fr
        label: Français
        type: file
        path: _data/fr/volunteering.yml
        format: yaml
        fields:
          - name: testimonials
            label: Experiencias
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - { name: intro, label: Introducción, type: string }
              - name: items
                label: Experiencias
                type: object
                list:
                  collapsible: { collapsed: true, summary: "{name} · {meta}" }
                fields:
                  - { name: quote, label: "Cita corta (siempre visible)", type: text }
                  - { name: name, label: Nombre, type: string }
                  - { name: meta, label: "Línea pequeña (por ejemplo «Voluntariado · octubre de 2026»)", type: string }
                  - name: photo
                    label: "Foto (opcional)"
                    type: image
                    options: { media: fotos }
                  - { name: text, label: "Relato completo (opcional)", type: text }

  - name: voluntariado
    label: "Voluntariado: datos prácticos"
    type: group
    items:
      - name: practico_es
        label: Español
        type: file
        path: _data/es/volunteering.yml
        format: yaml
        fields:
          - name: practical
            label: Datos prácticos
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - name: items
                label: Datos
                type: object
                list:
                  collapsible: { summary: "{label}" }
                fields:
                  - { name: label, label: "Tema (por ejemplo Estancia)", type: string }
                  - { name: value, label: Texto, type: text }
              - { name: wwoof, label: "Texto del enlace a WWOOF", type: string }
      - name: practico_en
        label: English
        type: file
        path: _data/en/volunteering.yml
        format: yaml
        fields:
          - name: practical
            label: Datos prácticos
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - name: items
                label: Datos
                type: object
                list:
                  collapsible: { summary: "{label}" }
                fields:
                  - { name: label, label: "Tema (por ejemplo Estancia)", type: string }
                  - { name: value, label: Texto, type: text }
              - { name: wwoof, label: "Texto del enlace a WWOOF", type: string }
      - name: practico_fr
        label: Français
        type: file
        path: _data/fr/volunteering.yml
        format: yaml
        fields:
          - name: practical
            label: Datos prácticos
            type: object
            fields:
              - { name: title, label: Título de la sección, type: string }
              - name: items
                label: Datos
                type: object
                list:
                  collapsible: { summary: "{label}" }
                fields:
                  - { name: label, label: "Tema (por ejemplo Estancia)", type: string }
                  - { name: value, label: Texto, type: text }
              - { name: wwoof, label: "Texto del enlace a WWOOF", type: string }

  - name: especies
    label: Especies y cámaras trampa
    description: Las especies amenazadas de la página de ciencia, con las fotos de las cámaras trampa.
    type: file
    path: _data/species.yml
    format: yaml
    list: true
    fields:
      - { name: latin, label: Nombre científico, type: string, required: true }
      - name: name
        label: "Nombre"
        type: object
        fields:
          - { name: es, label: Español, type: string }
          - { name: en, label: English, type: string }
          - { name: fr, label: Français, type: string }
      - name: status
        label: Categoría de amenaza
        type: select
        options:
          values:
            - { name: CR, label: "CR – En peligro crítico" }
            - { name: EN, label: "EN – En peligro" }
            - { name: VU, label: "VU – Vulnerable" }
            - { name: NT, label: "NT – Casi amenazado" }
      - name: image
        label: Ilustración
        type: image
        options: { media: especies }
      - name: snapshots
        label: Fotos de las cámaras trampa
        type: object
        list:
          collapsible: { summary: "{alt.es}" }
        fields:
          - name: image
            label: Foto
            type: image
            options: { media: camaras }
          - name: alt
            label: "Descripción de la foto (por ejemplo «Jaguar de noche, noviembre de 2025»)"
            type: object
            fields:
              - { name: es, label: Español, type: string }
              - { name: en, label: English, type: string }
              - { name: fr, label: Français, type: string }
      - name: videos
        label: "Videos de las cámaras trampa (los archivos MP4 se suben por GitHub)"
        type: object
        list:
          collapsible: { summary: "{title.es}" }
        fields:
          - { name: file, label: "Archivo MP4 (por ejemplo /assets/video/oso-andino-1.mp4)", type: string }
          - { name: poster, label: "Imagen de vista previa (por ejemplo /assets/video/oso-andino-1.jpg)", type: string }
          - name: title
            label: "Título"
            type: object
            fields:
              - { name: es, label: Español, type: string }
              - { name: en, label: English, type: string }
              - { name: fr, label: Français, type: string }

  - name: videos
    label: Videos
    description: "Videos de YouTube: basta el código del video. Los archivos MP4 se suben por GitHub."
    type: file
    path: _data/videos.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: "Título"
        type: object
        fields:
          - { name: es, label: Español, type: string }
          - { name: en, label: English, type: string }
          - { name: fr, label: Français, type: string }
      - name: text
        label: "Texto corto"
        type: object
        fields:
          - { name: es, label: Español, type: text }
          - { name: en, label: English, type: text }
          - { name: fr, label: Français, type: text }
      - { name: youtube, label: "Código de YouTube (por ejemplo AbCdEf12345 de https://youtu.be/AbCdEf12345)", type: string }
      - { name: file, label: "Archivo MP4 (solo videos subidos por GitHub, por ejemplo /assets/video/video.mp4)", type: string }
      - { name: poster, label: "Imagen de vista previa del MP4 (por ejemplo /assets/video/video.jpg)", type: string }
